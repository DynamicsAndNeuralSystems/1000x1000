# Family cards for the web resource (s1000 site). Keyed by family name (class.key).
# Fields: description (prose), equations (list of LaTeX display strings, KaTeX subset),
# simulation (how it is generated here), references (list of strings).
# A family without an entry falls back to its generator's docstring.
# Drafted 2026-09-25 from the generators' docstrings and code; physics and references to be checked by Ben.
# Parameter ranges follow the code where it differs from a docstring.

A.gaussian:
  description: >-
    Independent, identically distributed standard Gaussian draws. The reference null: no temporal
    structure of any order, and a Gaussian marginal.
  equations:
    - x_t \sim \mathcal{N}(0, 1) \quad \text{i.i.d.}
  simulation: Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\mathcal{N}(0, 1)\): the standard Gaussian distribution'

B.ar1:
  description: >-
    The first-order autoregressive process, the discrete-time analogue of the Ornstein-Uhlenbeck
    process. The autocorrelation decays geometrically, as \(\phi^k\); negative \(\phi\) gives an
    alternating, blue-noise character.
  equations:
    - x_t = \phi\, x_{t-1} + \varepsilon_t, \qquad \varepsilon_t \sim \mathcal{N}(0, \sigma^2)
    - \rho(k) = \phi^{|k|}
  simulation: >-
    \(\phi\) stratified over (−0.98, 0.98); a 2000-sample burn-in is discarded.
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise), variance \(\sigma^2\)'
    - '\(\phi\): the autoregressive coefficient'
    - '\(\rho(k)\): the autocorrelation at lag \(k\)'

E.setar:
  description: >-
    Self-exciting threshold autoregression: the AR coefficient switches when a lagged value of the
    series itself crosses a threshold, giving piecewise-linear dynamics with asymmetric cycles.
  equations:
    - x_t = \phi^{(j)} x_{t-1} + \varepsilon_t \quad \text{if } r_{j-1} < x_{t-d} \le r_j
  simulation: >-
    2 regimes (threshold 0) or 3 (two thresholds uniform on [−1, 1]); delay \(d \in \{1, 2, 3\}\);
    regime coefficients \(\phi\) stratified over [0.4, 0.9], uniform on [−0.6, 0.2] and (third regime) on [−0.3, 0.7].
  references:
    - Tong & Lim (1980). Threshold autoregression, limit cycles and cyclical data. J. R. Stat. Soc. B 42, 245–292.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(j\): the regime; \(\phi^{(j)}\): its autoregressive coefficient'
    - '\(r_j\): the regime thresholds; \(d\): the delay of the switching variable'

F.logistic:
  description: >-
    The logistic map across its chaotic range, beyond the period-doubling cascade. Parameters that land
    in a periodic window are redrawn, so every instance is chaotic.
  equations:
    - x_{n+1} = r\, x_n (1 - x_n)
  simulation: \(r\) stratified over [3.5, 4] and redrawn on [3.57, 4] until the Lyapunov exponent \(\lambda\), estimated along the orbit, is positive; burn-in discarded.
  references:
    - May (1976). Simple mathematical models with very complicated dynamics. Nature 261, 459–467.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(r\): the growth parameter'

F.circle-map:
  description: >-
    The sine circle map above its critical coupling \(K = 1\), where the map is no longer invertible and
    chaos appears between the overlapping mode-locked (Arnold tongue) regions.
  equations:
    - \theta_{n+1} = \theta_n + \Omega - \frac{K}{2\pi} \sin(2\pi \theta_n) \pmod 1
    - x_n = \sin(2\pi\theta_n)
  simulation: \(K\) stratified over [1.05, 2.5], \(\Omega\) uniform on [0.05, 0.95]; periodic orbits are redrawn; observed through \(\sin 2\pi\theta\) to remove the wrap.
  references:
    - Jensen, Bak & Bohr (1984). Transition to chaos by interaction of resonances in dissipative systems. I. Circle maps. Phys. Rev. A 30, 1960–1969.
  where:
    - '\(\theta_n\): the phase at iteration \(n\), in \([0, 1)\); \(x_n\): the observed series'
    - '\(\Omega\): the bare frequency (winding); \(K\): the nonlinearity (coupling) strength'

G.dysts-flow:
  description: >-
    One trajectory from each usable chaotic flow in the dysts database, from Lorenz and Rössler to
    lesser-known systems of chemistry, circuits and fluid mechanics. Each instance names its system.
  equations:
    - \dot{\mathbf{u}} = \mathbf{f}(\mathbf{u}), \qquad x_t = u_c(t_0 + t\,\Delta t) + \eta_t
  simulation: >-
    DOP853, resampled to 15–40 points per period and coarsened where the autocorrelation time
    exceeds 5 samples; a random coordinate \(c\), perturbed initial condition, burn-in discarded,
    optional measurement noise \(\eta_t\). \(\lambda_{\max}\) from a Benettin estimate, per sample.
  references:
    - Gilpin (2021). Chaos as an interpretable benchmark for forecasting and data-driven modelling. NeurIPS Datasets & Benchmarks.
  where:
    - '\(\mathbf{u}\): the system''s state vector; \(\mathbf{f}\): its vector field (its explicit equations are shown for each series)'
    - '\(u_c\): the observed coordinate \(c\) of the state'
    - '\(\Delta t\): the sampling interval, \(T/n_p\), with \(T\) the system''s dominant period in its own time units'
    - '\(t_0\): the time at the end of the discarded transient (burn-in)'
    - '\(n_p\): the number of samples per period of the system''s dominant oscillation (points per period)'
    - '\(\eta_t\): white measurement noise added to the observation'

# ---------------------------------------------------------------- A · IID
A.uniform:
  description: Independent draws from a uniform distribution, the flattest bounded marginal.
  equations:
    - 'x_t \sim \mathcal{U}[-1, 1] \quad \text{i.i.d.}'
  simulation: Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\mathcal{U}[-1, 1]\): the uniform distribution on \([-1, 1]\)'

A.laplace:
  description: Independent draws from the Laplace (double-exponential) distribution, with a sharper peak and heavier tails than the Gaussian.
  equations:
    - 'x_t \sim \tfrac{1}{2b}\, e^{-|x|/b} \quad \text{i.i.d.}'
  simulation: Unit scale (\(b = 1\)). Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(b\): the scale of the Laplace distribution'

A.student-t:
  description: Independent Student-t draws. Small \(\nu\) gives heavy, power-law tails; \(\nu \to \infty\) recovers the Gaussian.
  equations:
    - 'x_t \sim t_\nu \quad \text{i.i.d.}, \qquad p(x) \propto \left(1 + x^2/\nu\right)^{-(\nu+1)/2}'
  simulation: \(\nu \in \{3, 4, 5, 7\}\) in this profile, so every instance has finite variance. Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_\nu\): Student''s t distribution with \(\nu\) degrees of freedom; \(p(x)\): its density'

A.skewed:
  description: Independent draws from right-skewed distributions (gamma, log-normal, chi-square).
  equations:
    - 'x_t \sim \mathrm{Gamma}(k, 1),\ \ \mathrm{LogNormal}(0, \sigma^2)\ \ \text{or}\ \ \chi^2_k \quad \text{i.i.d.}'
  simulation: Gamma shape \(k\) log-uniform on [0.3, 3]; log-normal \(\sigma\) uniform on [0.3, 1.5]; chi-square \(k \in \{1, \dots, 4\}\). Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\mathrm{Gamma}(k, 1)\): gamma distribution with shape \(k\) and unit scale'
    - '\(\mathrm{LogNormal}(0, \sigma^2)\): \(e^{Z}\) with \(Z \sim \mathcal{N}(0, \sigma^2)\)'
    - '\(\chi^2_k\): chi-square distribution with \(k\) degrees of freedom'

A.bimodal:
  description: Independent draws from a two-component Gaussian mixture, so the marginal has two modes but there is no temporal structure.
  equations:
    - 'x_t \sim (1-w)\,\mathcal{N}(0, 1) + w\,\mathcal{N}(\Delta, 1) \quad \text{i.i.d.}'
  simulation: Separation \(\Delta\) uniform on [2, 5] SD, weight \(w\) uniform on [0.2, 0.5]. Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(w\): the weight of the second component'
    - '\(\Delta\): the separation of the two components, in standard deviations'

A.exponential-pareto:
  description: Independent draws from an exponential (light, one-sided tail) or a Pareto distribution (power-law tail).
  equations:
    - 'x_t \sim \mathrm{Exp}(1) \quad \text{or} \quad P(x_t > x) = (x_{\min}/x)^{\alpha}'
  simulation: Pareto tail index \(\alpha\) log-uniform on [2.2, 4], so the variance is finite; \(x_{\min} = 1\). Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\mathrm{Exp}(1)\): the unit-rate exponential distribution'
    - '\(\alpha\): the Pareto tail index; \(x_{\min}\): its scale (the smallest value)'

A.heavy-finite:
  description: Heavy-tailed white noise that still has finite variance, either Student-t or a Gaussian scale mixture that occasionally draws from a much wider Gaussian.
  equations:
    - 'x_t \sim t_\nu \quad \text{or} \quad x_t \sim (1-p)\,\mathcal{N}(0, 1) + p\,\mathcal{N}(0, 5^2)'
  simulation: Student-t \(\nu\) stratified over [3, 6] (even instances); mixture weight \(p\) uniform on [0.02, 0.1] (odd instances). Best of 12 independent draws; the realisation whose empirical distribution is closest (Kolmogorov–Smirnov distance) to the target law is kept.
  references:
    - Johnson, Kotz & Balakrishnan (1994). Continuous Univariate Distributions, Vol. 1, 2nd ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_\nu\): Student''s t distribution with \(\nu\) degrees of freedom'
    - '\(p\): the probability of a draw from the wide component (standard deviation 5)'

# ---------------------------------------------------------------- B · LG
B.ar2:
  description: >-
    Second-order autoregression. With complex characteristic roots it is a damped stochastic
    oscillator with a pseudo-period; with two real roots it is a sum of two relaxations.
  equations:
    - 'x_t = \phi_1 x_{t-1} + \phi_2 x_{t-2} + \varepsilon_t'
    - '\text{complex roots } r e^{\pm i\omega}:\ \ \phi_1 = 2r\cos\omega,\ \ \phi_2 = -r^2,\ \ P = 2\pi/\omega'
  simulation: Half the instances have complex roots (pseudo-period \(P\) stratified over [3, 80] samples, modulus \(r\) over [0.5, 0.99]), half have two real roots.
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(\phi_1, \phi_2\): the autoregressive coefficients'
    - '\(r e^{\pm i\omega}\): the complex roots of the characteristic polynomial, with modulus \(r\) and angle \(\omega\)'
    - '\(P\): the pseudo-period, in samples'

B.arp:
  description: Higher-order autoregressions with rich, multi-peaked spectra.
  equations:
    - 'x_t = \sum_{k=1}^{p} \phi_k x_{t-k} + \varepsilon_t'
  simulation: >-
    Order \(p \in \{3, \dots, 12\}\). Coefficients are built from reflection (partial autocorrelation)
    coefficients drawn uniformly on (−0.8, 0.8) via the Levinson–Durbin recursion, which guarantees stationarity;
    redrawn until the slowest mode decays within about 30 samples (spectral radius ≤ 0.97).
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(p\): the order; \(\phi_k\): the autoregressive coefficients'

B.maq:
  description: Moving-average processes, whose autocorrelation is exactly zero beyond lag \(q\).
  equations:
    - 'x_t = \varepsilon_t + \sum_{j=1}^{q} \theta_j \varepsilon_{t-j}'
  simulation: \(q \in \{1, \dots, 10\}\), \(\theta_j = u_j r^j\) with \(u_j\) uniform on (−1, 1) and \(r\) on [0.5, 0.95]. Non-invertible cases are allowed.
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(q\): the order; \(\theta_j\): the moving-average coefficients'

B.arma:
  description: Mixed autoregressive moving-average processes, the general finite-parameter linear Gaussian model.
  equations:
    - 'x_t = \sum_{k=1}^{p} \phi_k x_{t-k} + \varepsilon_t + \sum_{j=1}^{q} \theta_j \varepsilon_{t-j}, \qquad p, q \le 4'
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(\phi_k\): autoregressive coefficients (order \(p\)); \(\theta_j\): moving-average coefficients (order \(q\))'

B.seasonal-arma:
  description: A multiplicative seasonal autoregression, with dependence at lag 1 and at a seasonal lag \(s\). Its autocorrelation has peaks at multiples of \(s\).
  equations:
    - '(1 - \phi B)(1 - \Phi B^{s})\, x_t = \varepsilon_t, \quad \text{i.e.} \quad x_t = \phi\, x_{t-1} + \Phi\, x_{t-s} - \phi\Phi\, x_{t-s-1} + \varepsilon_t'
  simulation: Season \(s\) stratified over [4, 60] samples, \(\Phi\) uniform on [0.5, 0.95], \(\phi\) uniform on [−0.5, 0.5].
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(s\): the seasonal lag; \(\Phi\): the seasonal coefficient; \(\phi\): the lag-1 coefficient'
    - '\(B\): the backshift operator, \(B x_t = x_{t-1}\)'

B.narrowband:
  description: Gaussian noise band-pass filtered around a centre frequency, a random quasi-oscillation whose phase and amplitude wander.
  equations:
    - 'x_t = (h * \varepsilon)_t, \qquad |H(f)|^2 \text{ a Butterworth band-pass at } f_0 \text{ with quality } Q = f_0/\Delta f'
  simulation: Second-order Butterworth band-pass; centre \(f_0\) log-uniform on [0.05, 0.4] cycles/sample (at least 50 cycles per record), \(Q\) log-uniform on [2, 30].
  references:
    - Oppenheim & Schafer (2010). Discrete-Time Signal Processing, 3rd ed. Pearson.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(h\): the filter''s impulse response; \(*\): convolution; \(H(f)\): its frequency response'
    - '\(f_0\): the centre frequency (cycles per sample); \(\Delta f\): the bandwidth; \(Q = f_0/\Delta f\): the quality factor'

B.lowhigh-pass:
  description: Gaussian noise through a low-pass or a high-pass Butterworth filter.
  equations:
    - 'x_t = (h * \varepsilon)_t, \qquad |H(f)|^2 = \left[1 + (f/f_c)^{\pm 2n}\right]^{-1}'
  simulation: Low-pass for even instances, high-pass for odd; cutoff \(f_c\) log-uniform on [0.02, 0.4] cycles/sample, order \(n \in \{2, \dots, 8\}\).
  references:
    - Oppenheim & Schafer (2010). Discrete-Time Signal Processing, 3rd ed. Pearson.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(h\): the filter''s impulse response; \(*\): convolution; \(H(f)\): its frequency response'
    - '\(f_c\): the cutoff frequency; \(n\): the filter order; the exponent is \(+2n\) for low-pass and \(-2n\) for high-pass'

B.random-spectrum:
  description: A Gaussian process with a spectrum nobody named. Its log power spectrum is itself a smooth random function of log-frequency.
  equations:
    - 'x_t = \sum_k \sqrt{S(f_k)}\, \cos(2\pi f_k t + \varphi_k), \qquad \log S(f) \sim \mathrm{GP}(\log f), \ \ \varphi_k \sim \mathcal{U}[0, 2\pi)'
  references:
    - Percival & Walden (1993). Spectral Analysis for Physical Applications. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(S(f)\): the power spectrum; \(f_k\): the Fourier frequencies'
    - '\(\varphi_k\): independent uniform random phases'
    - '\(\mathrm{GP}\): a smooth Gaussian process in \(\log f\)'

# ---------------------------------------------------------------- C · LNG
C.ar-skew:
  description: Linear autoregressions driven by skewed (centred gamma) innovations. The dependence is linear, but the marginal and the dynamics are asymmetric.
  equations:
    - 'x_t = \sum_{k=1}^{p} \phi_k x_{t-k} + \varepsilon_t, \qquad \varepsilon_t = g_t - k,\ \ g_t \sim \mathrm{Gamma}(k, 1)'
  simulation: \(p \le 3\); shape \(k\) log-uniform on [0.4, 3], so innovation skewness \(2/\sqrt{k}\) runs from about 1.2 to 3.2.
  references:
    - Lawrance (1991). Directionality and reversibility in time series. Int. Stat. Rev. 59, 67–79.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\phi_k\): autoregressive coefficients (order \(p\))'
    - '\(\varepsilon_t\): centred gamma innovations; \(g_t\): a gamma draw with shape \(k\)'

C.arma-heavy:
  description: Autoregressions driven by heavy-tailed Student-t innovations, so large shocks propagate through the linear filter.
  equations:
    - 'x_t = \sum_{k=1}^{p} \phi_k x_{t-k} + \varepsilon_t, \qquad \varepsilon_t \sim t_\nu'
  simulation: Order \(p \in \{1, 2, 3\}\) with stable coefficients from reflection coefficients; Student-t \(\nu\) stratified over [3, 6] in this profile (finite variance; the full profile also has α-stable innovations).
  references:
    - Box, Jenkins, Reinsel & Ljung (2015). Time Series Analysis, 5th ed. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\phi_k\): the autoregressive coefficients (order \(p\))'
    - '\(\varepsilon_t\): Student-t innovations with \(\nu\) degrees of freedom'

C.ma-asym-skew:
  description: >-
    A one-sided, decaying moving average of skewed innovations. A linear process can be
    time-irreversible when its innovations are non-Gaussian and its filter is asymmetric (Weiss 1975).
  equations:
    - 'x_t = \sum_{j=0}^{q} \theta_j \varepsilon_{t-j}, \qquad \varepsilon_t \text{ skewed}, \ \ \theta_j \text{ decaying}'
  references:
    - Weiss (1975). Time-reversibility of linear stochastic processes. J. Appl. Probab. 12, 831–836.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\theta_j\): the moving-average coefficients, decaying with lag (order \(q\))'
    - '\(\varepsilon_t\): independent skewed innovations'

C.levy-ou:
  fixed:
    - 'Jump sizes \(Y_k \sim \mathrm{Exp}(1)\)'
  description: >-
    An Ornstein–Uhlenbeck-type process driven by compound-Poisson jumps (a Lévy-driven OU): each jump
    kicks the state, which then decays exponentially. The paths are sawtooth-like and time-irreversible.
  equations:
    - 'x_t = a\, x_{t-1} + J_t + \sigma \eta_t, \qquad J_t = \textstyle\sum_{\text{jumps in } t} Y_k,\ \ Y_k \sim \mathrm{Exp}'
  simulation: >-
    Jump rate log-uniform on [0.05, 0.4] per sample, exponential jump sizes (one-sided for even
    instances, two-sided for odd), decay \(a\) stratified over [0.6, 0.93] (decay times of about 2.5–14
    samples). Instances 0, 1, 4, 5, … add a Gaussian part with \(\sigma = 0.3\).
  references:
    - Barndorff-Nielsen & Shephard (2001). Non-Gaussian Ornstein–Uhlenbeck-based models and some of their uses in financial economics. J. R. Stat. Soc. B 63, 167–241.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(a\): the decay factor per sample'
    - '\(J_t\): the sum of the jumps arriving in sample \(t\) (Poisson arrivals); \(Y_k\): exponential jump sizes'
    - '\(\eta_t\): Gaussian noise with scale \(\sigma\) (zero for the pure jump process)'

C.ar-bounded:
  description: An AR(1) driven by bounded innovations (binary ±1 or uniform). For binary input and \(|\phi| \le 1/2\) the stationary law is a Cantor-like or uniform measure rather than a Gaussian.
  equations:
    - 'x_t = \phi\, x_{t-1} + \varepsilon_t, \qquad \varepsilon_t \in \{-1, +1\} \ \text{or}\ \varepsilon_t \sim \mathcal{U}[-1, 1]'
  simulation: \(\phi\) stratified over (−0.9, 0.9); binary innovations for even instances, uniform for odd.
  references:
    - Solomyak (1995). On the random series Σ ±λ^n (an Erdős problem). Ann. Math. 142, 611–625.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\phi\): the autoregressive coefficient'
    - '\(\varepsilon_t\): binary \(\pm 1\) or uniform innovations'

C.shot-noise:
  fixed:
    - 'Pulse amplitudes \(A_k \sim \mathrm{Exp}(1)\)'
  description: Poisson shot noise, a superposition of identical pulses arriving at random times. It is linear (a filtered point process) and non-Gaussian.
  equations:
    - 'x_t = \sum_{k} A_k\, h(t - t_k), \qquad t_k \sim \text{Poisson}(\lambda)'
  simulation: Pulse shape \(h\) exponential, alpha-function or Gaussian; rate \(\lambda\) log-uniform on [0.05, 0.3] per sample; width log-uniform on [1.5, 6] samples; exponential amplitudes \(A_k\).
  references:
    - Rice (1944). Mathematical analysis of random noise. Bell Syst. Tech. J. 23, 282–332.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_k\): pulse arrival times, a Poisson process with rate \(\lambda\) per sample'
    - '\(A_k\): the pulse amplitudes; \(h\): the pulse shape'

# ---------------------------------------------------------------- D · LRD
D.fgn:
  description: >-
    Fractional Gaussian noise, the increments of fractional Brownian motion: stationary and Gaussian,
    with power-law autocorrelation. \(H > 1/2\) gives long memory (persistence), \(H < 1/2\) anti-persistence.
  equations:
    - '\gamma(k) = \tfrac{\sigma^2}{2}\left(|k+1|^{2H} - 2|k|^{2H} + |k-1|^{2H}\right) \sim \sigma^2 H(2H-1)\, k^{2H-2}'
  simulation: Exact circulant-embedding synthesis (Davies–Harte); \(H\) stratified over [0.02, 0.9].
  references:
    - Mandelbrot & Van Ness (1968). Fractional Brownian motions, fractional noises and applications. SIAM Rev. 10, 422–437.
    - Davies & Harte (1987). Tests for Hurst effect. Biometrika 74, 95–101.
  where:
    - '\(\gamma(k)\): the autocovariance at lag \(k\)'
    - '\(\sigma^2\): the variance; \(H\): the Hurst exponent'

D.arfima:
  description: >-
    Fractionally integrated ARMA: a fractional difference operator gives hyperbolically decaying
    autocorrelation, with short-memory ARMA structure on top.
  equations:
    - '\phi(B)\,(1 - B)^{d}\, x_t = \theta(B)\, \varepsilon_t, \qquad (1-B)^d = \sum_{k\ge 0} \binom{d}{k} (-B)^k'
  simulation: \(d\) stratified over [−0.45, 0.4] (stationary and invertible); \(p, q \in \{0, 1\}\) with coefficients uniform on [−0.6, 0.6].
  references:
    - Granger & Joyeux (1980). An introduction to long-memory time series models and fractional differencing. J. Time Ser. Anal. 1, 15–29.
    - Hosking (1981). Fractional differencing. Biometrika 68, 165–176.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(B\): the backshift operator, \(B x_t = x_{t-1}\)'
    - '\(\phi(B), \theta(B)\): the AR and MA polynomials'
    - '\(d\): the fractional differencing order; \(\binom{d}{k}\): the generalised binomial coefficient'

D.mrw:
  description: >-
    Increments of the multifractal random walk: a noise modulated by a log-correlated (multifractal)
    volatility, giving intermittent bursts at every scale and scale-dependent heavy tails.
  equations:
    - 'x_t = \epsilon_t\, e^{\omega_t}, \qquad \mathrm{Cov}(\omega_t, \omega_{t+\tau}) = \lambda^2 \ln\!\left(L / (|\tau| + 1)\right) \ \ (|\tau| < L)'
  simulation: >-
    \(\epsilon_t\) fractional Gaussian noise with \(H\) stratified over [0.3, 0.7] (Student-t innovations
    for odd instances); intermittency \(\lambda^2\) over [0.03, 0.15]; integral scale \(L\) log-uniform on
    [64, 1024]. Generated at length 8192 and windowed.
  references:
    - Bacry, Delour & Muzy (2001). Multifractal random walk. Phys. Rev. E 64, 026103.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\epsilon_t\): fractional Gaussian noise with Hurst exponent \(H\)'
    - '\(\omega_t\): the log-volatility, a log-correlated Gaussian process'
    - '\(\lambda^2\): the intermittency coefficient; \(L\): the integral scale (in samples)'

D.discrete-cascade:
  description: >-
    A noise modulated by a multiplicative cascade on a dyadic tree: the binomial p-model or a
    log-Poisson cascade. Volatility is intermittent in a scale-invariant way.
  equations:
    - 'x_t = \epsilon_t \sqrt{\textstyle\prod_{j=1}^{J} W_{j, k_j(t)}}, \qquad W \in \{2p, 2(1-p)\} \ \ \text{(p-model)}'
  simulation: p-model with \(p\) stratified over [0.55, 0.68] (even instances), log-Poisson cascade (odd); random grid phase.
  references:
    - Meneveau & Sreenivasan (1987). Simple multifractal cascade model for fully developed turbulence. Phys. Rev. Lett. 59, 1424.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\epsilon_t\): fractional Gaussian noise'
    - '\(W_{j, k}\): the random weight of box \(k\) at cascade level \(j\); \(k_j(t)\): the box containing \(t\); \(J\): the number of levels'
    - '\(p\): the p-model''s weight parameter'

D.lmsv:
  description: Long-memory stochastic volatility, in which the log-volatility is itself a persistent fractional Gaussian noise.
  equations:
    - 'x_t = \epsilon^{(H)}_t \exp\!\left(s\, \eta^{(H_w)}_t\right)'
  simulation: \(\eta\) fGn with \(H_w\) stratified over [0.75, 0.95]; scale \(s\) over [0.3, 0.8].
  references:
    - Breidt, Crato & de Lima (1998). The detection and estimation of long memory in stochastic volatility. J. Econometrics 83, 325–348.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\epsilon^{(H)}_t\): fractional Gaussian noise with Hurst exponent \(H\)'
    - '\(\eta^{(H_w)}_t\): a second, persistent fGn with Hurst exponent \(H_w\), driving the log-volatility'
    - '\(s\): the volatility scale'

D.one-over-f-stationary:
  description: Power-law (1/f) noise with exponent below 1, where the process is still stationary.
  equations:
    - 'S(f) \propto f^{-\beta}, \qquad 0 \le \beta < 1'
  simulation: Spectral synthesis (random phases on a power-law amplitude spectrum); \(\beta\) stratified over [0, 0.95].
  references:
    - Keshner (1982). 1/f noise. Proc. IEEE 70, 212–218.
  where:
    - '\(S(f)\): the power spectrum at frequency \(f\)'
    - '\(\beta\): the spectral exponent'

# ---------------------------------------------------------------- E · NLS
E.expar:
  description: >-
    Exponential autoregression: the AR coefficient depends smoothly on the previous value, so small
    and large excursions relax at different rates. It can support limit cycles.
  equations:
    - 'x_t = \left(a + b\, e^{-x_{t-1}^2}\right) x_{t-1} + \varepsilon_t'
  references:
    - Haggan & Ozaki (1981). Modelling nonlinear random vibrations using an amplitude-dependent autoregressive time series model. Biometrika 68, 189–196.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(a, b\): the coefficients of the amplitude-dependent AR coefficient'

E.bilinear:
  description: >-
    A bilinear moving average. The autocorrelation is zero beyond lag 0, like white noise, but the
    series is not independent; the dependence shows up in higher-order moments.
  equations:
    - 'x_t = \varepsilon_t + c\, \varepsilon_{t-1} \varepsilon_{t-2}'
  simulation: \(c\) stratified over [0.4, 1]; Gaussian innovations (even instances) or skewed (odd).
  references:
    - Granger & Andersen (1978). An Introduction to Bilinear Time Series Models. Vandenhoeck & Ruprecht.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(c\): the bilinear coefficient'

E.random-coef-ar:
  description: An AR(1) whose coefficient is redrawn at every step, giving conditional heteroskedasticity and heavy tails from a linear-looking recursion.
  equations:
    - 'x_t = (\phi + \sigma_\phi \eta_t)\, x_{t-1} + \varepsilon_t'
  simulation: \(\sigma_\phi\) stratified over [0.1, 0.4].
  references:
    - Nicholls & Quinn (1982). Random Coefficient Autoregressive Models. Springer.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(\phi\): the mean AR coefficient; \(\sigma_\phi\): its standard deviation'
    - '\(\eta_t\): independent standard Gaussian noise, redrawn each sample'

E.garch:
  fixed:
    - '\(\omega = 0.05\)'
  description: >-
    Conditionally heteroskedastic returns: volatility clusters because today's variance depends on
    yesterday's squared shock. GJR and EGARCH variants add the leverage effect (asymmetry in the sign of the shock).
  equations:
    - 'r_t = \sigma_t z_t, \qquad \sigma_t^2 = \omega + \alpha\, r_{t-1}^2 + \beta\, \sigma_{t-1}^2 \quad \text{(GARCH(1,1))}'
    - '\text{GJR: } + \gamma\, r_{t-1}^2 \mathbb{1}[r_{t-1} < 0], \qquad \text{EGARCH: } \ln\sigma_t^2 = \omega + \beta \ln\sigma_{t-1}^2 + \alpha(|z_{t-1}| - \mathbb{E}|z|) + \gamma z_{t-1}'
  simulation: ARCH(1), GARCH(1,1), GJR-GARCH or EGARCH with Gaussian or Student-t \(z_t\); persistence stratified over [0.6, 0.99].
  references:
    - Engle (1982). Autoregressive conditional heteroscedasticity with estimates of the variance of United Kingdom inflation. Econometrica 50, 987–1007.
    - Bollerslev (1986). Generalized autoregressive conditional heteroskedasticity. J. Econometrics 31, 307–327.
  where:
    - '\(r_t\): the observed returns'
    - '\(\sigma_t^2\): the conditional variance; \(z_t\): independent Gaussian or Student-t shocks'
    - '\(\omega, \alpha, \beta\): the GARCH coefficients; \(\gamma\): the leverage (asymmetry) coefficient'
    - '\(\mathbb{1}[\cdot]\): the indicator function; \(\mathbb{E}|z|\): the mean absolute shock'

E.stoch-vol:
  description: Stochastic volatility, in which the log-variance follows its own autoregression driven by a separate noise.
  equations:
    - 'r_t = e^{h_t/2} z_t, \qquad h_t = \phi\, h_{t-1} + \sigma \eta_t'
  simulation: \(\phi\) stratified over [0.8, 0.95], \(\sigma\) over [0.15, 0.4].
  references:
    - Taylor (1986). Modelling Financial Time Series. Wiley.
  where:
    - '\(r_t\): the observed returns'
    - '\(h_t\): the log-variance; \(\phi\): its persistence; \(\sigma\): its noise scale'
    - '\(z_t, \eta_t\): independent standard Gaussian noises'

E.markov-switching-ar:
  description: An AR(1) whose parameters switch between regimes according to a hidden Markov chain.
  equations:
    - 'x_t = \mu_{s_t} + \phi_{s_t}(x_{t-1} - \mu_{s_{t-1}}) + \sigma_{s_t} \varepsilon_t, \qquad s_t \text{ Markov}'
  simulation: 2–4 regimes with mean dwell log-uniform on [8, 60] samples (at least about 15 regime changes per record); regimes differ in a drawn subset of \(\{\phi, \mu, \sigma\}\).
  references:
    - Hamilton (1989). A new approach to the economic analysis of nonstationary time series and the business cycle. Econometrica 57, 357–384.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(s_t\): the hidden regime, a Markov chain'
    - '\(\mu_s, \phi_s, \sigma_s\): the mean, AR coefficient and noise scale of regime \(s\)'

E.hmm:
  description: >-
    Hidden Markov models: a discrete hidden chain read out through noisy Gaussian emissions. The cyclic
    three-state chain violates detailed balance, so the series is time-irreversible.
  equations:
    - 's_t \sim P(s_t \mid s_{t-1}), \qquad x_t \mid s_t \sim \mathcal{N}(\mu_{s_t}, \sigma^2_{s_t})'
  simulation: Two-state (even instances) or cyclic three-state (odd) chains with Gaussian emissions; mean dwell log-uniform on [4, 50] samples.
  references:
    - Rabiner (1989). A tutorial on hidden Markov models and selected applications in speech recognition. Proc. IEEE 77, 257–286.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(s_t\): the hidden state, a Markov chain with transition probabilities \(P(s_t \mid s_{t-1})\)'
    - '\(\mu_s, \sigma_s\): the emission mean and standard deviation of state \(s\)'

E.stochastic-map:
  description: >-
    Chaotic maps with dynamical noise added at every step, so the orbit is perturbed as it evolves rather
    than only when it is measured.
  equations:
    - 'x_{n+1} = f_\mu(x_n) + \sigma \eta_n, \qquad f \in \{\text{logistic, tent, Hénon, Ricker, Holmes}\}'
  simulation: Noise level log-stratified over [0.01, 0.1] (weaker noise left the orbit indistinguishable from the clean map), scaled to each map (additive for logistic, tent and Hénon; for Ricker it enters the exponent, as environmental noise). Map parameters are redrawn until the noise-free map is chaotic. One instance is the Holmes (Duffing) map \(x \mapsto y,\ y \mapsto -0.2x + 2.7y - y^3\), a map with no clean twin in the collection.
  references:
    - Crutchfield, Farmer & Huberman (1982). Fluctuations and simple chaotic dynamics. Phys. Rep. 92, 45–82.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(f_\mu\): the deterministic map with parameter \(\mu\)'
    - '\(\sigma\): the dynamical noise scale; \(\eta_n\): independent standard Gaussian noise'

E.star:
  description: >-
    Smooth-transition autoregressions: the AR coefficients move smoothly between two regimes as a
    lagged value crosses a threshold (logistic or exponential transition), plus additive nonlinear ARs.
  equations:
    - 'x_t = \left[\phi_1 (1 - G) + \phi_2\, G\right] x_{t-1} + \varepsilon_t'
    - 'G_{\mathrm{L}} = \left[1 + e^{-\gamma x_{t-1}}\right]^{-1}, \qquad G_{\mathrm{E}} = 1 - e^{-\gamma x_{t-1}^2/4}'
  simulation: LSTAR, ESTAR, or additive \(x_t = g(x_{t-1}) + \varepsilon_t\) with \(g\) a sine or tanh; steepness \(\gamma\) log-uniform on [1, 20]; \(\phi_1\) uniform on [0.2, 0.8], \(\phi_2\) on [−0.8, 0.2].
  references:
    - Teräsvirta (1994). Specification, estimation, and evaluation of smooth transition autoregressive models. J. Am. Stat. Assoc. 89, 208–218.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(\phi_1, \phi_2\): the AR coefficients in the two regimes'
    - '\(G\): the transition function (logistic \(G_{\mathrm{L}}\) or exponential \(G_{\mathrm{E}}\)), centred at 0; \(\gamma\): its steepness'

E.volterra:
  description: A second-order Volterra series, a moving average with quadratic cross terms between lagged innovations.
  equations:
    - 'x_t = \sum_{j=0}^{3} h_j \varepsilon_{t-j} + w \sum_{j \le k} h_{jk}\, \varepsilon_{t-j}\varepsilon_{t-k}'
  simulation: Nonlinear weight \(w\) stratified over [0.3, 1].
  references:
    - Schetzen (1980). The Volterra and Wiener Theories of Nonlinear Systems. Wiley.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(h_j\): the linear kernel; \(h_{jk}\): the quadratic kernel; \(w\): the weight of the quadratic part'

E.bistable-map:
  fixed:
    - 'Step size \(h = 0.1\)'
  description: A noisy double-well map. The state lingers near one of two stable points and hops between them at noise-driven, irregular times.
  equations:
    - 'x_t = x_{t-1} + h\left(x_{t-1} - x_{t-1}^3\right) + \sigma \varepsilon_t'
  simulation: \(h = 0.1\); \(\sigma\) stratified over [0.22, 0.4], so there are at least about 40 well crossings per record.
  references:
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(h\): the step size; \(\sigma\): the noise scale'

E.cubic-crisis:
  description: >-
    Noise-induced switching between two chaotic attractors. Just below its attractor-merging crisis, the
    symmetric cubic map has two mirror-image chaotic bands; weak noise kicks the orbit between them.
  equations:
    - 'x_{n+1} = a\, x_n - x_n^3 + \sigma \eta_n, \qquad a < 3\sqrt{3}/2 \approx 2.598'
  simulation: \(a\) stratified over [2.50, 2.58]; noise \(\sigma\) log-uniform on [0.03, 0.06].
  references:
    - Grebogi, Ott & Yorke (1983). Crises, sudden changes in chaotic attractors, and transient chaos. Physica D 7, 181–200.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(a\): the map parameter; \(\sigma\): the noise scale; \(\eta_n\): independent standard Gaussian noise'

E.kesten:
  description: >-
    A Kesten random multiplicative process. Occasional runs of multipliers above 1 give bursts of
    exponential growth, and the stationary law has a power-law tail even though the inputs are light-tailed.
  equations:
    - 'x_{n+1} = a_n x_n + b_n, \qquad \ln a_n \sim \mathcal{N}(m, s^2),\ m < 0'
    - 'P(x > u) \sim u^{-\kappa}, \qquad \kappa = -2m/s^2'
  simulation: Tail exponent \(\kappa\) stratified over [2.3, 4] (finite variance).
  references:
    - Kesten (1973). Random difference equations and renewal theory for products of random matrices. Acta Math. 131, 207–248.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(a_n\): random multipliers, log-normal with log-mean \(m\) and log-standard deviation \(s\)'
    - '\(b_n\): positive random additive terms'
    - '\(\kappa\): the exponent of the power-law tail'

# ---------------------------------------------------------------- F · MAP
F.classic-1d:
  description: Classic one-dimensional chaotic maps across their chaotic ranges.
  equations:
    - '\text{tent: } x \mapsto \mu \min(x, 1-x), \qquad \text{sine: } x \mapsto \mu \sin(\pi x)'
    - '\text{cubic: } x \mapsto a x (1 - x^2), \qquad \text{Chebyshev: } x \mapsto \cos(k \arccos x)'
  references:
    - Collet & Eckmann (1980). Iterated Maps on the Interval as Dynamical Systems. Birkhäuser.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(\mu\), \(a\): the map parameters; \(k\): the Chebyshev order'

F.pomeau-manneville:
  description: >-
    Type-I intermittency: long laminar phases creeping away from a marginally stable fixed point at 0,
    interrupted by chaotic bursts that reinject the orbit near 0.
  equations:
    - 'x_{n+1} = x_n + x_n^{z} \pmod 1'
  simulation: \(z\) stratified over [1.3, 1.85], where the invariant measure is finite (\(z \to 2\) is the infinite-measure boundary); laminar phases of tens of samples, many per record.
  references:
    - Pomeau & Manneville (1980). Intermittent transition to turbulence in dissipative dynamical systems. Commun. Math. Phys. 74, 189–197.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(z\): the order of tangency at the marginal fixed point \(x = 0\)'

F.shift-gauss:
  description: The Bernoulli (doubling) shift, the textbook fully chaotic map, and the Gauss map, which generates continued-fraction digits.
  equations:
    - 'x_{n+1} = 2 x_n \pmod 1, \qquad x_{n+1} = 1/x_n \pmod 1'
  simulation: The doubling map is iterated in exact rational arithmetic, because floating point collapses it to 0 within about 53 steps.
  references:
    - Lasota & Mackey (1994). Chaos, Fractals, and Noise, 2nd ed. Springer.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'

F.piecewise-impact:
  description: >-
    Piecewise maps with a square-root branch, the normal form near a grazing impact (Nordmark map).
    The square-root singularity gives strong stretching on one side of the border.
  equations:
    - 'x_{n+1} = \begin{cases} a x_n + d & x_n < 0 \\ -c\sqrt{x_n} + d & x_n \ge 0 \end{cases}'
  simulation: \(a\) stratified over [0.5, 0.95]; \(c\) uniform on [1, 3] and \(d\) on [0.2, 0.8], redrawn until the Lyapunov exponent is positive. The map is continuous at the border \(x = 0\).
  references:
    - Nordmark (1991). Non-periodic motion caused by grazing incidence in an impact oscillator. J. Sound Vib. 145, 279–297.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(a\): the slope of the linear branch; \(c\): the square-root coefficient; \(d\): the common offset (the value at the border)'

F.dysts-map:
  description: One trajectory from each of 18 usable discrete-time maps in the dysts database, observed in one coordinate.
  equations:
    - '\mathbf{u}_{n+1} = \mathbf{F}(\mathbf{u}_n), \qquad x_n = u_{c,n}'
  simulation: Default dysts parameters, a perturbed initial condition, burn-in discarded. Circle, Duffing and Gingerbreadman are excluded (unbounded, drifting or periodic at their defaults); a near-regular coordinate is swapped for the map's other coordinate.
  references:
    - Gilpin (2021). Chaos as an interpretable benchmark for forecasting and data-driven modelling. NeurIPS Datasets & Benchmarks.
  where:
    - '\(\mathbf{u}_n\): the map''s state at iteration \(n\); \(\mathbf{F}\): its update rule (explicit equations are shown for each series)'
    - '\(u_{c,n}\): the observed coordinate \(c\)'

F.map-sweep:
  description: >-
    Regime sweeps of two-dimensional maps: Hénon, Lozi, Ikeda, the Chirikov standard map from mixed
    KAM tori and chaos to global chaos, Arnold's cat, Burgers and a coupled logistic pair.
  equations:
    - '\text{Hénon: } x_{n+1} = 1 - a x_n^2 + y_n,\ \ y_{n+1} = b x_n'
    - '\text{standard map: } p_{n+1} = p_n + K \sin\theta_n,\ \ \theta_{n+1} = \theta_n + p_{n+1}'
  simulation: One parameter swept per map; \(a\) for Hénon (periodic windows redrawn) and Lozi, \(u\) on [0.7, 0.9] for Ikeda, and \(K \in \{0.5, 2.5, 3, 4.5, 6\}\) for the standard map, observed as \(\sin\theta\).
  references:
    - Hénon (1976). A two-dimensional mapping with a strange attractor. Commun. Math. Phys. 50, 69–77.
    - Chirikov (1979). A universal instability of many-dimensional oscillator systems. Phys. Rep. 52, 263–379.
  where:
    - '\(x_n, y_n\): the Hénon map''s coordinates; \(a, b\): its parameters'
    - '\(\theta_n, p_n\): the standard map''s angle and momentum; \(K\): the kick strength'

F.aperiodic-real:
  description: >-
    Deterministic but aperiodic real-valued sequences: the density of live cells in successive rows of an
    elementary cellular automaton, rule 30 (Wolfram class 3, chaotic) and rule 110 (class 4, a periodic
    background crossed by interacting gliders).
  equations:
    - 's_{i}^{(n+1)} = s_{i-1}^{(n)} \oplus \left(s_{i}^{(n)} \lor s_{i+1}^{(n)}\right), \qquad x_n = \tfrac{1}{W}\sum_i s_i^{(n)}'
  simulation: Rule 30 on 3000 cells and rule 110 on 8000 cells, from random initial rows; the transient is discarded.
  references:
    - Wolfram (1983). Statistical mechanics of cellular automata. Rev. Mod. Phys. 55, 601–644.
  where:
    - '\(s_i^{(n)} \in \{0, 1\}\): cell \(i\) in row \(n\) of the automaton; \(\oplus\): exclusive or; \(\lor\): or (the rule-30 update shown; rule 110 has its own lookup table)'
    - '\(W\): the row width; \(x_n\): the fraction of live cells in row \(n\)'

F.rulkov:
  description: >-
    The Rulkov map neuron: a fast variable that spikes chaotically and a slow variable that switches
    bursting on and off, giving bursts of spikes separated by silent recovery.
  equations:
    - 'x_{n+1} = \frac{\alpha}{1 + x_n^2} + y_n, \qquad y_{n+1} = y_n - \mu (x_n - \sigma)'
  simulation: \(\alpha\) stratified over [4.1, 4.6]; \(\mu\) log-uniform on [0.003, 0.01] sets the burst period (about 10 bursts per record).
  references:
    - Rulkov (2001). Regularization of synchronized chaotic bursts. Phys. Rev. Lett. 86, 183–186.
  where:
    - '\(x_n\): the fast (membrane-potential-like) variable, observed; \(y_n\): the slow recovery variable'
    - '\(\alpha\): the nonlinearity; \(\mu\): the slow time-scale ratio; \(\sigma\): the slow variable''s set point'

F.sna:
  description: >-
    A strange nonchaotic attractor: quasi-periodic forcing makes the attractor fractal, yet its
    Lyapunov exponent is negative, so it is strange without being chaotic.
  equations:
    - 'x_{n+1} = 2\sigma \tanh(x_n) \cos(2\pi\theta_n), \qquad \theta_{n+1} = \theta_n + \omega \pmod 1'
  simulation: \(\omega\) the golden mean, \(\sigma > 1\).
  references:
    - Grebogi, Ott, Pelikan & Yorke (1984). Strange attractors that are not chaotic. Physica D 13, 261–268.
  where:
    - '\(x_n\): the observed state'
    - '\(\theta_n\): the quasi-periodic forcing phase; \(\omega\): its frequency (the golden mean)'
    - '\(\sigma\): the forcing strength'

# ---------------------------------------------------------------- G · FLOW
G.canonical-sweep:
  description: >-
    Regimes of canonical chaotic flows that the dysts defaults miss: Lorenz at ρ = 24.5 (chaos coexisting
    with stable fixed points) and at ρ = 130 (far above the classic ρ = 28), the Chen system, the Rössler
    funnel (a = 0.3, c = 14), Chua's double scroll, the forced Duffing oscillator, the driven damped
    pendulum, the double pendulum and Lorenz-84.
  equations:
    - '\text{Lorenz: } \dot x = \sigma(y - x),\ \ \dot y = x(\rho - z) - y,\ \ \dot z = xy - \beta z'
    - '\text{Rössler: } \dot x = -y - z,\ \ \dot y = x + a y,\ \ \dot z = b + z(x - c)'
    - '\text{Duffing: } \ddot x + \delta \dot x - x + x^3 = \gamma \cos \omega t'
  references:
    - Lorenz (1963). Deterministic nonperiodic flow. J. Atmos. Sci. 20, 130–141.
    - Rössler (1976). An equation for continuous chaos. Phys. Lett. A 57, 397–398.
  where:
    - '\(x, y, z\): the state variables; the dot is the time derivative'
    - 'Lorenz: \(\sigma, \rho, \beta\); Rössler: \(a, b, c\)'
    - 'Duffing: \(\delta\) damping, \(\gamma\) forcing amplitude, \(\omega\) forcing frequency'
    - 'Each series'' explicit equations and observed variable are shown with it'

G.dde-stationary:
  description: >-
    Chaotic delay-differential equations, whose infinite-dimensional state gives high-dimensional chaos
    from a single scalar feedback loop: Mackey–Glass, the Ikeda delay equation, Uçar's cubic prototype
    (slow, wandering chaos) and the band-pass optoelectronic Ikeda oscillator (chaotic switching between plateaus).
  equations:
    - '\text{Mackey–Glass: } \dot x = \beta \frac{x_\tau}{1 + x_\tau^{n}} - \gamma x, \qquad \text{Ikeda: } \dot x = -x + \mu \sin(x_\tau), \qquad x_\tau = x(t - \tau)'
    - '\text{Uçar: } \dot x = x_\tau - x_\tau^3, \qquad \text{band-pass Ikeda: } \epsilon \dot x = -x - y/\theta + \beta \sin^2(x_\tau + \phi),\ \ \dot y = x'
  simulation: >-
    Mackey–Glass with \(\beta = 0.2, \gamma = 0.1, n = 10\) and \(\tau\) stratified over [17, 40] (the chaotic range);
    Ikeda with \(\tau = 2\), \(\mu\) stratified over [5, 30]; Uçar with \(\tau\) over [1.6, 1.7]; these by fixed-step RK4
    on an integer delay grid, resampled to 15–40 points per period. Band-pass Ikeda with \(\tau = 1\), \(\epsilon = 0.01\),
    \(\theta = 50\), \(\phi = -\pi/4\) and \(\beta\) over [2, 2.5], observed every 0.02 (20 delays per record).
  references:
    - Mackey & Glass (1977). Oscillation and chaos in physiological control systems. Science 197, 287–289.
    - Ikeda & Matsumoto (1987). High-dimensional chaotic behavior in systems with time-delayed feedback. Physica D 29, 223–235.
    - Uçar (2002). A prototype model for chaos studies. Int. J. Eng. Sci. 40, 251–258.
    - Peil, Jacquot, Chembo, Larger & Erneux (2009). Routes to chaos and multiple time scale dynamics in broadband bandpass nonlinear delay electro-optic oscillators. Phys. Rev. E 79, 026208.
  where:
    - '\(x\): the state (observed); \(x_\tau = x(t - \tau)\): its value a delay \(\tau\) ago'
    - 'Mackey–Glass: \(\beta\) production, \(\gamma\) decay, \(n\) nonlinearity; Ikeda: \(\mu\) feedback gain'
    - 'Band-pass Ikeda: \(y\) the integrated (low-frequency) variable, \(\epsilon\) and \(\theta\) the fast and slow filter time scales, \(\beta\) the feedback gain, \(\phi\) the operating-point offset'

G.dysts-flow-coarse:
  description: Chaotic dysts flows sampled coarsely, at 4–10 points per period (80–250 periods per record), the regime of Empirical1000's own chaotic-flow series.
  equations:
    - '\dot{\mathbf{u}} = \mathbf{f}(\mathbf{u}), \qquad x_t = u_c(t\,\Delta t) + \eta_t, \quad \Delta t = T/n_p'
  references:
    - Gilpin (2021). Chaos as an interpretable benchmark for forecasting and data-driven modelling. NeurIPS Datasets & Benchmarks.
  where:
    - '\(\mathbf{u}\): the system''s state vector; \(\mathbf{f}\): its vector field (its explicit equations are shown for each series)'
    - '\(u_c\): the observed coordinate \(c\) of the state'
    - '\(\Delta t\): the sampling interval, \(T/n_p\), with \(T\) the system''s dominant period in its own time units'
    - '\(n_p\): the number of samples per period of the system''s dominant oscillation (points per period)'
    - '\(\eta_t\): white measurement noise added to the observation'

G.dysts-flow-extra:
  description: >-
    A second realisation of six systems whose single dysts-flow instance was the most interesting:
    Sakarya, ZhouChen, BlinkingRotlet, Halvorsen, Rabinovich–Fabrikant and Dadras. Each uses a different
    observed coordinate, sampling density and initial condition.
  equations:
    - '\dot{\mathbf{u}} = \mathbf{f}(\mathbf{u}), \qquad x_t = u_c(t\,\Delta t) + \eta_t'
  references:
    - Gilpin (2021). Chaos as an interpretable benchmark for forecasting and data-driven modelling. NeurIPS Datasets & Benchmarks.
  where:
    - '\(\mathbf{u}\): the system''s state vector; \(\mathbf{f}\): its vector field (its explicit equations are shown for each series)'
    - '\(u_c\): the observed coordinate \(c\) of the state'
    - '\(\Delta t\): the sampling interval, \(T/n_p\), with \(T\) the system''s dominant period in its own time units'
    - '\(n_p\): the number of samples per period of the system''s dominant oscillation (points per period)'
    - '\(\eta_t\): white measurement noise added to the observation'

G.blinking-rotlet:
  description: >-
    Chaotic advection: a tracer in a Stokes flow stirred by two rotlets that switch on and off
    alternately. Each flow alone is integrable; switching between them creates chaos.
  equations:
    - '\dot{\mathbf{r}} = \mathbf{v}_{1}(\mathbf{r})\, \mathbb{1}[\,t \bmod 2\tau < \tau\,] + \mathbf{v}_{2}(\mathbf{r})\, \mathbb{1}[\,t \bmod 2\tau \ge \tau\,]'
  simulation: Switching period \(\tau\) log-uniform on [0.8, 10]; short periods give fast irregular mixing, long ones smooth rotation broken by bursts at each switch. Observed x or y.
  references:
    - Meleshko & Aref (1996). A blinking rotlet model for chaotic advection. Phys. Fluids 8, 3215–3217.
  where:
    - '\(\mathbf{r}\): the tracer''s position'
    - '\(\mathbf{v}_1, \mathbf{v}_2\): the velocity fields of the two rotlets'
    - '\(\tau\): the switching period; \(\mathbb{1}[\cdot]\): the indicator function'

G.billiard:
  description: The Bunimovich stadium billiard, Hamiltonian chaos made of straight flights and specular bounces off the walls.
  equations:
    - '\dot{\mathbf{r}} = \mathbf{v}, \qquad \mathbf{v} \mapsto \mathbf{v} - 2(\mathbf{v}\cdot\hat{\mathbf{n}})\hat{\mathbf{n}} \ \text{at the wall}'
  simulation: Half-length \(L\) stratified over [0.5, 2]; x or y sampled at fixed time steps, about three samples per flight.
  references:
    - Bunimovich (1979). On the ergodic properties of nowhere dispersing billiards. Commun. Math. Phys. 65, 295–312.
  where:
    - '\(\mathbf{r}, \mathbf{v}\): the particle''s position and velocity'
    - '\(\hat{\mathbf{n}}\): the unit normal to the wall at the point of impact'

G.bouncing-ball:
  description: >-
    A ball bouncing on a sinusoidally vibrating table: ballistic flights under gravity joined by
    inelastic impacts. It is chaotic for moderate table accelerations.
  equations:
    - '\ddot{z} = -g \ \ \text{between impacts}, \qquad \dot z^{+} - \dot s = -e\,(\dot z^{-} - \dot s), \quad s(t) = A\sin\omega t'
  simulation: Normalised acceleration \(\Gamma = A\omega^2/g\) in about [2.5, 4], restitution \(e\) drawn; ball height sampled 6 times per table period.
  references:
    - Holmes (1982). The dynamics of repeated impacts with a sinusoidally vibrating table. J. Sound Vib. 84, 173–189.
  where:
    - '\(z\): the ball''s height; \(s(t)\): the table''s height'
    - '\(g\): gravitational acceleration; \(e\): the coefficient of restitution'
    - '\(A, \omega\): the table''s amplitude and angular frequency; \(\pm\): just after/before an impact'

# ---------------------------------------------------------------- H · OSC
H.sinusoid:
  description: A pure sinusoid, from near the Nyquist frequency to very slow.
  equations:
    - 'x_t = \sin(2\pi t / P + \varphi)'
  simulation: Period \(P\) log-uniform on [2.2, 60] samples (at least 16 cycles per record).
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(P\): the period in samples; \(\varphi\): the phase'

H.harmonic:
  description: Periodic waveforms made of many harmonics, a sawtooth or a random set of harmonics.
  equations:
    - 'x_t = \sum_{k=1}^{K} a_k \sin(2\pi k t / P + \varphi_k)'
  simulation: Sawtooth, or \(K \in \{2, \dots, 20\}\) harmonics with random, decaying amplitudes and random phases; period \(P\) log-uniform on [8, 120] samples.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(K\): the number of harmonics; \(a_k, \varphi_k\): their amplitudes and phases; \(P\): the fundamental period'

H.quasiperiodic:
  description: Motion on a 2- or 3-torus, a sum of sinusoids with incommensurate frequencies. It never exactly repeats.
  equations:
    - 'x_t = \sum_{k=1}^{2\text{ or }3} a_k \sin(2\pi f_k t + \varphi_k), \qquad f_i/f_j \notin \mathbb{Q}'
  simulation: Frequency ratios near the golden mean and \(\sqrt 2\); random amplitudes.
  references:
    - 'Pikovsky, Rosenblum & Kurths (2001). Synchronization: A Universal Concept in Nonlinear Sciences. Cambridge University Press.'
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(f_k\): incommensurate frequencies (ratios not rational); \(a_k, \varphi_k\): amplitudes and phases'
    - '\(\mathbb{Q}\): the rational numbers'

H.limit-cycle:
  fixed:
    - 'Stuart–Landau: \(\omega = 1\); FitzHugh–Nagumo: \(a = 0.7\), \(b = 0.8\), \(\varepsilon = 0.08\)'
  description: Self-sustained oscillators on a stable limit cycle, from nearly sinusoidal to relaxation oscillations.
  equations:
    - '\text{van der Pol: } \ddot x - \mu (1 - x^2)\dot x + x = 0'
    - '\text{Brusselator: } \dot x = a + x^2 y - (b + 1) x,\ \ \dot y = b x - x^2 y'
    - '\text{FitzHugh–Nagumo: } \dot v = v - v^3/3 - w + I,\ \ \dot w = \epsilon\,(v + a - b w)'
  simulation: van der Pol (\(\mu\) log-stratified over [0.1, 10]; two instances), the Brusselator (\(b > 1 + a^2\)) and oscillatory FitzHugh–Nagumo (\(I\) uniform on [0.5, 1.2]; two instances), integrated and resampled to 15–40 points per period.
  references:
    - van der Pol (1926). On relaxation-oscillations. Phil. Mag. 2, 978–992.
  where:
    - '\(x\): the observed variable; \(\mu\): the van der Pol nonlinearity'
    - 'Brusselator: \(x, y\) the intermediate concentrations, \(a, b\) the feed parameters'
    - 'FitzHugh–Nagumo: \(v\) the fast variable, \(w\) the recovery variable, \(I\) the input, \(a, b, \epsilon\) the recovery parameters'

H.modulated-stationary:
  description: Amplitude-modulated, frequency-modulated and beating oscillations with stationary modulation.
  equations:
    - '\text{AM: } (1 + m\cos 2\pi f_m t) \cos 2\pi f_c t, \qquad \text{FM: } \cos\!\left(2\pi f_c t + \beta \sin 2\pi f_m t\right)'
  where:
    - '\(f_c\): the carrier frequency; \(f_m\): the modulation frequency'
    - '\(m\): the AM modulation depth; \(\beta\): the FM modulation index'

H.period-doubled-flows:
  description: Periodic orbits of flows that are chaotic at other parameters, Rössler at c = 8.5 (period 4, in its period-doubling cascade) and Lorenz at ρ = 350 (a periodic window).
  equations:
    - '\text{Rössler: } \dot x = -y - z,\ \ \dot y = x + a y,\ \ \dot z = b + z(x - c)'
  references:
    - Rössler (1976). An equation for continuous chaos. Phys. Lett. A 57, 397–398.
    - 'Sparrow (1982). The Lorenz Equations: Bifurcations, Chaos, and Strange Attractors. Springer.'
  where:
    - '\(x, y, z\): the Rössler state; \(a, b, c\): its parameters (explicit values are shown with each series)'

H.cycle-shapes:
  description: >-
    Periodic orbits with unusual waveforms: Hindmarsh–Rose periodic bursting, the triangle-like
    Rayleigh oscillator, a conservative Lotka–Volterra orbit far from equilibrium (sharp pulses on a flat
    floor) and a pendulum librating just inside its separatrix.
  equations:
    - '\text{Rayleigh: } \ddot x - \mu\left(1 - \dot x^2\right)\dot x + x = 0, \qquad \text{pendulum: } \ddot\theta = -\sin\theta'
  references:
    - Hindmarsh & Rose (1984). A model of neuronal bursting using three coupled first order differential equations. Proc. R. Soc. B 221, 87–102.
  where:
    - '\(x\): the observed variable; \(\mu\): the Rayleigh nonlinearity'
    - '\(\theta\): the pendulum angle'

# ---------------------------------------------------------------- I · SDE
I.ou:
  description: The Ornstein–Uhlenbeck process, the continuous-time AR(1) and the canonical mean-reverting noise.
  equations:
    - 'dx = -\frac{x}{\tau}\, dt + \sqrt{\frac{2}{\tau}}\, dW'
  simulation: Correlation time \(\tau\) log-uniform on [1, 20] samples, at least 50 correlation times per record; subsampled from a fine integration.
  references:
    - Uhlenbeck & Ornstein (1930). On the theory of the Brownian motion. Phys. Rev. 36, 823–841.
  where:
    - '\(x\): the process; \(\tau\): its correlation time (in samples)'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

I.double-well:
  description: Overdamped Brownian motion in a double-well potential, with noise-driven hopping between the wells (Kramers escape).
  equations:
    - 'dx = (x - x^3)\, dt + \sigma\, dW, \qquad V(x) = x^4/4 - x^2/2'
  simulation: \(\sigma\) stratified over [0.5, 1.1], so there are at least about 30 hops per record.
  references:
    - Kramers (1940). Brownian motion in a field of force and the diffusion model of chemical reactions. Physica 7, 284–304.
  where:
    - '\(x\): the particle''s position; \(V(x)\): the double-well potential'
    - '\(\sigma\): the noise strength'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

I.near-critical:
  description: >-
    Noisy normal forms near a bifurcation. Close to criticality the restoring force vanishes, fluctuations
    grow and slow down (critical slowing down).
  equations:
    - '\text{pitchfork: } dx = (\mu x - x^3)\, dt + \eta\, dW, \qquad \text{saddle-node: } dx = (\mu - x^2)\, dt + \eta\, dW'
    - '\text{Hopf: } dz = \left[(\mu + i\omega) z - |z|^2 z\right] dt + \eta\, dW'
  simulation: Pitchfork, radial and planar Hopf, saddle-node and transcritical forms; \(\kappa = \mu/\eta\) stratified over near-critical (−0.15 to −0.01) and far (−3 to −1) values.
  references:
    - Scheffer et al. (2009). Early-warning signals for critical transitions. Nature 461, 53–59.
  where:
    - '\(x\): the observed state; \(z\): a complex amplitude (Hopf)'
    - '\(\mu\): the distance from the bifurcation; \(\eta\): the noise strength; \(\omega\): the Hopf frequency'
    - '\(\kappa = \mu/\eta\): the stratified distance to criticality, measured in noise units'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

I.noisy-limit-cycle:
  description: Limit-cycle oscillators with additive noise. The amplitude stays near the cycle while the phase diffuses, so coherence decays over time.
  equations:
    - 'd\mathbf{u} = \mathbf{f}(\mathbf{u})\, dt + \sigma\, d\mathbf{W}, \qquad \mathbf{f} = \text{van der Pol}'
  simulation: van der Pol with \(\mu\) uniform on [0.3, 3] (even instances) or in its relaxation regime, \(\mu\) on [2, 5], written in Liénard coordinates (odd); noise \(\sigma\) log-stratified over [0.3, 1]; 15–40 samples per period.
  references:
    - 'Pikovsky, Rosenblum & Kurths (2001). Synchronization: A Universal Concept in Nonlinear Sciences. Cambridge University Press.'
  where:
    - '\(\mathbf{u}\): the oscillator''s state; \(\mathbf{f}\): its vector field (explicit equations are shown for each series)'
    - '\(\sigma\): the noise strength; \(d\mathbf{W}\): independent Wiener increments in each coordinate'

I.noisy-chaos:
  description: Chaotic flows with dynamical noise, which perturbs the trajectory itself rather than the measurement.
  equations:
    - 'd\mathbf{u} = \mathbf{f}(\mathbf{u})\, dt + \sigma\, d\mathbf{W}, \qquad \mathbf{f} \in \{\text{Lorenz, Rössler, Chua}\}'
  simulation: >-
    Noise fraction \(\epsilon\) log-uniform on [0.1, 0.5] (capped at 0.06 for Chua, whose double scroll escapes under
    strong noise); below about 0.02 the noise is invisible against the deterministic motion. Sampled at 8–20 points per period.
  references:
    - Crutchfield, Farmer & Huberman (1982). Fluctuations and simple chaotic dynamics. Phys. Rep. 92, 45–82.
  where:
    - '\(\mathbf{u}\): the flow''s state; \(\mathbf{f}\): its vector field (explicit equations are shown for each series)'
    - '\(\sigma = \epsilon s\): the dynamical noise strength, a fraction \(\epsilon\) of the attractor''s typical size \(s\) (8 for Lorenz, 5 for Rössler, 1.5 for Chua)'
    - '\(d\mathbf{W}\), \(\xi(t)\): independent Wiener increments (white noise)'
    - 'Rössler and Chua: only \(x\) and \(y\) are forced'

I.stochastic-resonance:
  description: >-
    A double well with weak periodic forcing and noise. At an optimal noise level the hops lock to the
    forcing, which is the stochastic resonance effect.
  equations:
    - 'dx = \left(x - x^3 + A\cos\omega t\right) dt + \sigma\, dW'
  simulation: \(\sigma\) stratified around the resonance optimum.
  references:
    - Benzi, Sutera & Vulpiani (1981). The mechanism of stochastic resonance. J. Phys. A 14, L453.
    - Gammaitoni, Hänggi, Jung & Marchesoni (1998). Stochastic resonance. Rev. Mod. Phys. 70, 223–287.
  where:
    - '\(x\): the particle''s position in the double well'
    - '\(A, \omega\): the forcing amplitude and angular frequency; \(\sigma\): the noise strength'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

I.excitable-fhn:
  description: >-
    Excitable systems driven by noise: at rest they are stable, and noise triggers stereotyped spikes at
    irregular times. FitzHugh–Nagumo is type-II excitable (a Hopf threshold); the active rotator is type-I
    (a saddle-node on a circle), so its spikes can come arbitrarily slowly and its rest state is a slow drift.
  equations:
    - '\text{FitzHugh–Nagumo: } dv = \left(v - v^3/3 - w + I\right) dt + \sigma\, dW, \qquad \epsilon^{-1} dw = (v + a - b w)\, dt'
    - '\text{active rotator: } d\varphi = (1 - b \sin\varphi)\, dt + \sigma\, dW, \quad b > 1, \qquad x = -\cos\varphi'
  simulation: FitzHugh–Nagumo with \(I\) stratified over [0, 0.32] and \(\sigma\) log-uniform on [0.15, 0.4] (instances 0–4); active rotator with \(b\) over [1.03, 1.1] and \(\sigma\) uniform on [0.25, 0.35] (5–7).
  references:
    - FitzHugh (1961). Impulses and physiological states in theoretical models of nerve membrane. Biophys. J. 1, 445–466.
    - Lindner, García-Ojalvo, Neiman & Schimansky-Geier (2004). Effects of noise in excitable systems. Phys. Rep. 392, 321–424.
    - Shinomoto & Kuramoto (1986). Phase transitions in active rotator systems. Prog. Theor. Phys. 75, 1105–1110.
  where:
    - '\(v\): the fast (voltage-like) variable, observed; \(w\): the slow recovery variable'
    - '\(I\): the input current; \(a, b\): the recovery parameters; \(\epsilon\): the time-scale ratio'
    - '\(\sigma\): the noise strength'
    - '\(\varphi\): the rotator''s phase (a spike is a full turn); \(b\): its excitability (the pinning strength)'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

I.multiplicative-coloured:
  description: Linear relaxation with multiplicative (state-dependent) noise, which gives heavy tails, or driven by coloured (OU) noise.
  equations:
    - 'dx = (0.5 - x)\, dt + \left(\sigma |x| + 0.05\right) dW'
    - 'dx = -x\, dt + \xi\, dt, \qquad d\xi = -\xi/\tau_c\, dt + \sqrt{2/\tau_c}\, dW'
  simulation: Multiplicative noise with a small additive floor, \(\sigma\) stratified over [0.5, 1.4] (even instances); OU-coloured noise with \(\tau_c\) log-uniform on [0.5, 20] (odd).
  references:
    - Hänggi & Jung (1995). Colored noise in dynamical systems. Adv. Chem. Phys. 89, 239–326.
  where:
    - '\(x\): the observed process; \(\sigma\): the multiplicative noise strength (0.05 is a small additive floor)'
    - '\(\xi\): Ornstein–Uhlenbeck (coloured) noise with correlation time \(\tau_c\)'
    - '\(dW\): Wiener increments'

I.heteroclinic:
  description: >-
    A noisy heteroclinic cycle of three competing species (rock–paper–scissors dynamics). The state
    lingers near saddles where one species dominates and switches in a fixed cyclic order.
  equations:
    - '\dot x_k = x_k\left(1 - x_k - \alpha x_{k+1} - \beta x_{k+2}\right) + \delta\, \xi_k, \qquad \alpha < 1 < \beta,\ \alpha + \beta > 2'
  simulation: Symmetric competition, \(\alpha = 0.5\), \(\beta = 2\) (instances 0–1), or asymmetric, species-specific \(\alpha_k \in \{0.3, 0.55, 0.8\}\), \(\beta_k \in \{2.4, 1.9, 1.5\}\), so the plateaus differ in length (2). Noise \(\delta\) sets how long each plateau lasts (about \(\ln(1/\delta)\)); observed as \(x_1 + x_2/2\), so the three saddles read as three levels; about 30 dwells per record.
  references:
    - May & Leonard (1975). Nonlinear aspects of competition between three species. SIAM J. Appl. Math. 29, 243–253.
  where:
    - '\(x_k\): the abundance of species \(k = 1, 2, 3\), indices taken cyclically'
    - '\(\alpha, \beta\): the competition coefficients'
    - '\(\delta\): the noise strength; \(\xi_k\): independent white noises'

# ---------------------------------------------------------------- J · EVT
J.renewal:
  description: A renewal process with independent inter-event intervals, observed as the interval sequence.
  equations:
    - 't_{k+1} - t_k = \tau_k \sim F \ \text{i.i.d.}, \qquad B = \frac{\sigma_\tau - \mu_\tau}{\sigma_\tau + \mu_\tau}'
  simulation: \(F\) gamma, log-normal, Weibull or Pareto; mean interval stratified over [5, 60]; burstiness \(B\) stratified over [−0.5, 0.8].
  references:
    - Goh & Barabási (2008). Burstiness and memory in complex systems. EPL 81, 48002.
  where:
    - '\(t_k\): the event times; \(\tau_k\): the intervals, drawn independently from \(F\)'
    - '\(\mu_\tau, \sigma_\tau\): the mean and standard deviation of the intervals; \(B\): the burstiness'

J.hawkes:
  fixed:
    - 'Exponential kernel \(\phi(s) = (n/d)\, e^{-s/d}\) with decay \(d\); power-law kernel \(\phi(s) = n(\alpha - 1)(1 + s)^{-\alpha}\), \(\alpha = 1.5\)'
    - 'Read out as a Gaussian-kernel-smoothed event rate (bandwidth given for each series) plus 2% noise'
  description: A self-exciting point process. Each event raises the rate of future events, giving clusters and cascades.
  equations:
    - '\lambda(t) = \mu + \sum_{t_k < t} \phi(t - t_k), \qquad n = \int_0^\infty \phi(s)\, ds < 1'
  simulation: Branching ratio \(n\) stratified over [0.2, 0.98] (upper quarter near-critical); exponential (decay time 2–10) or power-law kernel \(\phi\); mean rate log-uniform on [0.2, 1] per sample; read out as a kernel-smoothed event rate.
  references:
    - Hawkes (1971). Spectra of some self-exciting and mutually exciting point processes. Biometrika 58, 83–90.
  where:
    - '\(\lambda(t)\): the conditional event rate; \(\mu\): the background rate'
    - '\(t_k\): past event times; \(\phi\): the excitation kernel'
    - '\(n\): the branching ratio (expected offspring per event)'

J.spike-signs:
  fixed:
    - 'Spike sizes \(A_n \sim\) U[4, 7] floor s.d.; inter-spike intervals Gamma(4, \(\tau/4\))'
  description: >-
    A marked point process on an AR floor: large spikes whose signs follow a third-order rule, so
    their signs have no pairwise correlation but are dependent in triples.
  equations:
    - 's_n = -s_{n-1} s_{n-2} r_n, \qquad x_t = \text{AR floor} + \sum_n s_n A_n \mathbb{1}[t = t_n]'
  simulation: Spikes of 4–7 SD at gamma(4) intervals with mean \(\tau\) stratified over [10, 40].
  references:
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_n\): the spike times; \(A_n\): the spike sizes; \(s_n = \pm 1\): the spike signs'
    - '\(r_n = \pm 1\): independent random signs; \(\mathbb{1}[\cdot]\): the indicator function'

J.compound-poisson-increments:
  description: Increments of a compound Poisson process with Pareto jumps, zero in most samples, like rainfall totals.
  equations:
    - 'x_t = \sum_{k=1}^{N_t} Y_k, \qquad N_t \sim \mathrm{Poisson}(\lambda), \ \ P(Y > y) \propto y^{-\alpha}'
  simulation: Tail \(\alpha\) stratified over [2.2, 3.5] (finite variance).
  references:
    - Cox & Isham (1980). Point Processes. Chapman & Hall.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(N_t\): the number of events in sample \(t\), Poisson with mean \(\lambda\)'
    - '\(Y_k\): the jump sizes, Pareto with tail index \(\alpha\)'

J.poisson-smoothed:
  fixed:
    - 'Read out as a Gaussian-kernel-smoothed event rate (bandwidth given for each series) plus 2% noise'
  description: A homogeneous Poisson event train read out as a kernel-smoothed firing rate.
  equations:
    - 'x_t = \sum_k K(t - t_k), \qquad t_k \sim \mathrm{Poisson}(\lambda)'
  simulation: Rate \(\lambda\) log-uniform on [0.05, 0.5] per sample.
  references:
    - Cox & Isham (1980). Point Processes. Chapman & Hall.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_k\): the event times, a Poisson process with rate \(\lambda\) per sample'
    - '\(K\): the smoothing kernel'

J.cox-smoothed:
  fixed:
    - 'Read out as a Gaussian-kernel-smoothed event rate (bandwidth given for each series) plus 2% noise'
  description: A doubly stochastic (Cox) process, whose Poisson rate is itself a log-normal random process. It is read out as a smoothed rate.
  equations:
    - '\lambda(t) = \bar\lambda\, e^{s\, u(t)}, \quad u \text{ an OU process}, \qquad x_t = \sum_k K(t - t_k)'
  simulation: OU correlation time log-uniform on [2, 10]; mean rate log-uniform on [0.5, 3].
  references:
    - Cox (1955). Some statistical methods connected with series of events. J. R. Stat. Soc. B 17, 129–164.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\lambda(t)\): the random event rate; \(\bar\lambda\): its scale; \(s\): the log-rate scale'
    - '\(u(t)\): an Ornstein–Uhlenbeck process; \(t_k\): the event times; \(K\): the smoothing kernel'

J.markov-chain-emitted:
  description: A discrete Markov chain read out through state-dependent Gaussian emissions, so the series steps between levels with noise.
  equations:
    - 's_t \sim P(s_t \mid s_{t-1}), \qquad x_t = s_t + \sigma \varepsilon_t'
  simulation: 2–6 states, mean dwell log-uniform on [2, 40] samples, random or cyclic transitions; \(\sigma\) uniform on [0.15, 0.4].
  references:
    - Rabiner (1989). A tutorial on hidden Markov models and selected applications in speech recognition. Proc. IEEE 77, 257–286.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(s_t\): the hidden state (an integer level), a Markov chain'
    - '\(\sigma\): the emission noise scale'

J.telegraph-noisy:
  description: Random telegraph noise, a two-state switching signal, in additive Gaussian noise.
  equations:
    - 'x_t = s_t + \sigma \varepsilon_t, \qquad s_t \in \{-1, +1\} \text{ switching at rate } \gamma'
  simulation: \(\gamma\) log-uniform on [0.03, 0.3] per sample; \(\sigma\) uniform on [0.1, 0.4].
  references:
    - 'Gardiner (2009). Stochastic Methods: A Handbook for the Natural and Social Sciences, 4th ed. Springer.'
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\varepsilon_t\): independent standard Gaussian noise (unless stated otherwise)'
    - '\(s_t\): the two-state telegraph signal; \(\gamma\): its switching rate'
    - '\(\sigma\): the noise scale'

# ---------------------------------------------------------------- L · COMP
L.longlag-comb:
  description: >-
    Dependence only at a long lag: the innovations feed back on themselves \(L\) steps later, then
    pass through a short AR filter. Short-lag statistics miss it. The nonlinear variant has zero
    autocorrelation at lag \(L\) but is still dependent there.
  equations:
    - 'u_t = e_t + \phi\, u_{t-L} \quad \text{or} \quad u_t = e_t + \phi\left(\min(u_{t-L}^2, 4) - c\right), \qquad x = \mathrm{AR}(p)[u]'
  simulation: \(L\) stratified over [40, 160], \(|\phi|\) over [0.2, 0.35], a random stable AR(\(p \le 4\)); \(c\) approximately centres the clipped square, so \(\rho(L) \approx 0\) while the dependence at lag \(L\) remains.
  references:
  where:
    - '\(x\): the observed series, an AR(\(p\)) filter applied to \(u\)'
    - '\(e_t\): independent Gaussian innovations; \(u_t\): the innovations with long-lag feedback'
    - '\(L\): the long lag; \(\phi\): the feedback coefficient; \(c\): the mean of the clipped square'

L.cyclostationary-switch:
  description: >-
    The dynamics switch every sample with a fixed period: the lag-\(L\) coefficient alternates, so
    correlation is periodic in time while the variance is not.
  equations:
    - 'x_t = \phi(t)\, x_{t-L} + s(t)\, e_t, \qquad \phi(t + P) = \phi(t)'
  simulation: \(P = 2\) (even instances) or \(P \in \{3, 4\}\) (odd); \(s(t)\) chosen so every phase has equal variance.
  references:
    - 'Gardner, Napolitano & Paura (2006). Cyclostationarity: half a century of research. Signal Process. 86, 639–697.'
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(e_t\): independent Gaussian noise'
    - '\(L\): the lag; \(\phi(t)\): the lag-\(L\) coefficient, periodic with period \(P\)'
    - '\(s(t)\): the noise scale, chosen so every phase has the same variance'

L.replay-recurrence:
  description: AR(1)-coloured noise that replays 15–30% of its own past in segments of 20–60 samples at random lags. The repeats are exact recurrences hidden in noise.
  equations:
    - 'x_t = \begin{cases} x_{t - \ell_k} & t \in \text{replay segment } k \\ \mathrm{AR}(1) & \text{otherwise} \end{cases}'
  simulation: AR(1) colour \(\phi\) drawn per series from [0.3, 0.8]; 15–30% of the innovations replayed, in segments of 20–60 samples copied from random earlier positions with fresh noise of 0.05–0.2 SD; the replay is applied to the innovations before filtering, so a replay has no boundary.
  references:
    - Eckmann, Kamphorst & Ruelle (1987). Recurrence plots of dynamical systems. Europhys. Lett. 4, 973–977.
    - Marwan, Romano, Thiel & Kurths (2007). Recurrence plots for the analysis of complex systems. Phys. Rep. 438, 237–329.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(\ell_k\): the lag of replay segment \(k\)'
    - 'AR(1): an autoregression of order 1 between replays'

L.pac:
  description: >-
    Phase–amplitude coupling, as seen in brain rhythms: the amplitude of a fast oscillation is
    modulated by the phase of a slow one.
  equations:
    - 'x_t = s_{\text{slow}}(t) + \left[1 + m \cos\theta_{\text{slow}}(t)\right] s_{\text{fast}}(t) + \sigma \varepsilon_t'
  simulation: Noise \(\sigma = 0.8\), coupling depth 0.6, rhythms with slowly wandering frequency; theta–gamma (narrow and broad band), delta–beta, alpha–gamma, and sleep slow-oscillation–spindle coupling (slow period 100–140 samples, spindle 7–9).
  references:
    - Canolty et al. (2006). High gamma power is phase-locked to theta oscillations in human neocortex. Science 313, 1626–1628.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(s_{\text{slow}}, s_{\text{fast}}\): the slow and fast oscillations'
    - '\(\theta_{\text{slow}}\): the slow oscillation''s phase; \(m\): the modulation depth'
    - '\(\sigma\): the noise scale; \(\varepsilon_t\): independent Gaussian noise'

L.qpc:
  description: >-
    Quadratic phase coupling: three narrowband components whose phases satisfy
    \(\theta_3 = \theta_1 + \theta_2 + \pi/2\) at every instant. Only the bispectrum detects it; the power spectrum does not.
  equations:
    - 'x_t = \sum_{k=1}^{3} a_k(t) \cos\theta_k(t), \qquad \theta_3 = \theta_1 + \theta_2 + \pi/2'
  simulation: Frequencies \(f_1, f_2\) drawn from [0.03, 0.18] cycles per sample (\(f_1 + f_2 < 0.45\)); complex Ornstein–Uhlenbeck envelopes with coherence time \(\tau\) log-uniform on [20, 120] samples; noise \(\sigma = 0.5\).
  references:
    - Kim & Powers (1979). Digital bispectral analysis and its applications to nonlinear wave interactions. IEEE Trans. Plasma Sci. 7, 120–131.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(a_k(t)\): the amplitudes and \(\theta_k(t)\): the phases of three narrowband components'

L.coupled-systems:
  description: >-
    Coupled chaotic systems, with coupling stratified across the synchronisation transition: Lorenz
    driving Rössler (the driven system is observed), two mismatched Rösslers (phase synchronisation),
    and a Kaneko coupled map lattice (a ring of 100 logistic-type maps, one site observed) in two
    regimes: spatiotemporal intermittency and fully developed spatiotemporal chaos.
  equations:
    - '\dot{\mathbf{u}}_2 = \mathbf{f}_2(\mathbf{u}_2) + \varepsilon\, \mathbf{C}(\mathbf{u}_1 - \mathbf{u}_2)'
    - 'x_{n+1}(i) = (1 - \varepsilon)\, f\big(x_n(i)\big) + \tfrac{\varepsilon}{2}\big[f\big(x_n(i-1)\big) + f\big(x_n(i+1)\big)\big]'
  simulation: >-
    Flows: coupling \(\varepsilon\) log-stratified over [0.02, 1]. Lattice: \(f(x) = 1 - a x^2\), 100 sites on a ring, 5000
    iterations discarded; intermittency at \(a \in [1.78, 1.82]\), \(\varepsilon = 0.3\); spatiotemporal chaos at
    \(a \in [1.95, 2]\), \(\varepsilon \in [0.03, 0.08]\).
  references:
    - Rosenblum, Pikovsky & Kurths (1996). Phase synchronization of chaotic oscillators. Phys. Rev. Lett. 76, 1804.
    - Kaneko (1989). Pattern dynamics in spatiotemporal chaos. Physica D 34, 1–41.
  where:
    - '\(\mathbf{u}_1\): the driving system''s state; \(\mathbf{u}_2\): the driven system''s state'
    - '\(\mathbf{f}_2\): the driven system''s vector field; \(\mathbf{C}\): the coupling matrix'
    - '\(x_n(i)\): the state of lattice site \(i\) at iteration \(n\), one sample per iteration; \(f\): the local map, with nonlinearity \(a\)'
    - '\(\varepsilon\): the coupling strength (explicit equations are shown for each series)'

L.mixture:
  fixed:
    - 'Lorenz: \(\sigma = 10\), \(\rho = 28\), \(\beta = 8/3\); Rössler: \(a = b = 0.2\), \(c = 5.7\); the chaotic part is standardised; the seasonal component carries noise of s.d. 0.3'
  description: Additive mixtures of different processes, such as a chaotic flow plus AR noise, a flow under a heavy noise floor, or Rössler plus a seasonal AR.
  equations:
    - 'x_t = y^{(1)}_t + a\, y^{(2)}_t'
  simulation: \(y^{(1)}\) standardised. Lorenz + AR(1) with amplitude ratio \(a\) log-stratified over [0.3, 3]; Lorenz under white noise at SNR −6 to 0 dB; Rössler + a noisy sinusoid; an AR(1) plus telegraph noise.
  references:
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y^{(1)}, y^{(2)}\): two independent component processes; \(a\): the amplitude ratio'

L.on-off:
  description: >-
    On-off intermittency: an invariant state loses transverse stability under chaotic driving, so the
    response idles near zero and then bursts.
  equations:
    - 'x_{n+1} = a\, \xi_n x_n (1 - x_n), \qquad \xi_n \sim \mathcal{U}[0, 1] \text{ (chaotic, from the } r = 4 \text{ logistic map)}'
  simulation: \(a\) just above the threshold \(a = e\), where \(x = 0\) loses transverse stability.
  references:
    - Platt, Spiegel & Tresser (1993). On-off intermittency. Phys. Rev. Lett. 70, 279–282.
    - Heagy, Platt & Hammel (1994). Characterization of on-off intermittency. Phys. Rev. E 49, 1140.
  where:
    - '\(x_n\): the state at iteration \(n\), one sample per iteration'
    - '\(a\): the coupling strength'
    - '\(\xi_n\): the chaotic driving signal, uniformly distributed on \([0, 1]\)'

# ---------------------------------------------------------------- M · OBS
M.clipped:
  description: A base process saturated at a fixed level, as when a sensor's range is exceeded.
  equations:
    - 'x_t = \min\!\left(\max(y_t, \mu - c\,\sigma), \mu + c\,\sigma\right)'
  simulation: \(c\) stratified over [0.5, 1.5] SD.
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y_t\): the underlying series; \(\mu, \sigma\): its mean and standard deviation'
    - '\(c\): the clipping level, in standard deviations'

M.missing-data:
  description: A base process with gaps, filled by holding the last value or by linear interpolation.
  equations:
    - 'x_t = y_t \ (t \notin \text{gaps}), \qquad x_t = y_{t_0} \ \text{or linear interpolation across the gap}'
  simulation: Missing fraction uniform on [0.05, 0.4] in gaps of mean length log-uniform on [1, 30]; zero-order hold (even instances) or linear (odd).
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y_t\): the underlying series; \(t_0\): the last observed sample before a gap'

M.irregular-sampling:
  description: >-
    A continuous-time process read at random times, as by an instrument with an irregular sampling
    clock. The values are recorded in order, one per reading, so the time between samples is itself random.
  equations:
    - 'x_n = y(t_n), \qquad t_{n+1} - t_n = 1 + N_n,\ \ N_n \sim \mathrm{Poisson}(k - 1)'
  simulation: A continuous-time base process from the collection, generated at \(k\) times the record length (\(k \in \{3, \dots, 6\}\)) and read at 1000 random times with mean spacing \(k\).
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(x_n\): the \(n\)-th recorded value; \(y(t)\): the underlying continuous-time process'
    - '\(t_n\): the reading times; \(k\): the mean spacing between readings, in the base process''s own samples'

M.aliased:
  description: A chaotic flow sampled below its natural resolution, at 2.5–6 points per period, so the waveform aliases.
  equations:
    - 'x_t = u_c(t\,\Delta t), \qquad \Delta t = T/n_p, \ \ n_p \in [2.5, 6]'
  references:
    - Oppenheim & Schafer (2010). Discrete-Time Signal Processing, 3rd ed. Pearson.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(u_c\): the observed coordinate of a chaotic flow'
    - '\(\Delta t\): the sampling interval, \(T/n_p\), with \(T\) the flow''s dominant period'
    - '\(n_p\): the number of samples per period of the system''s dominant oscillation (points per period)'

M.oversampled:
  description: A chaotic flow sampled densely, so each cycle is resolved smoothly and the record covers only 14–25 periods.
  equations:
    - 'x_t = u_c(t\,\Delta t), \quad \Delta t = T/n_p, \ \ n_p \in [40, 70]'
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(u_c\): the observed coordinate of a chaotic flow'
    - '\(\Delta t\): the sampling interval, \(T/n_p\), with \(T\) the flow''s dominant period'
    - '\(n_p\): the number of samples per period of the system''s dominant oscillation (points per period)'

M.nonlinear-readout:
  description: A base process observed through a static nonlinearity, which changes the marginal and higher-order statistics but not the underlying dynamics.
  equations:
    - 'x_t = g(y_t), \qquad g \in \{y^2, |y|, e^{y}, y^3\} \ \text{or}\ x_t = y_t y_{t-1}'
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y_t\): the underlying series, standardised; \(g\): the static readout function'

M.outliers:
  description: A base process with sparse additive outliers of random sign.
  equations:
    - 'x_t = y_t + \sum_k A_k \mathbb{1}[t = t_k], \qquad |A_k| \in [4, 10]\,\sigma_y'
  simulation: Outlier rate uniform on [0.005, 0.05].
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y_t\): the underlying series; \(\sigma_y\): its standard deviation'
    - '\(t_k\): the outlier times; \(A_k\): their sizes; \(\mathbb{1}[\cdot]\): the indicator function'

M.heavy-noise:
  description: A structured base process buried in white measurement noise at or below unit signal-to-noise ratio. White-noise bases are excluded, since white noise plus white noise is still white noise.
  equations:
    - 'x_t = y_t + \eta_t, \qquad \mathrm{SNR} = 10\log_{10}(\sigma_y^2/\sigma_\eta^2) \in [-6, 0]\ \mathrm{dB}'
  references:
    - Kantz & Schreiber (2004). Nonlinear Time Series Analysis, 2nd ed. Cambridge University Press.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y_t\): the underlying series; \(\eta_t\): white measurement noise'
    - '\(\sigma_y, \sigma_\eta\): their standard deviations; SNR: the signal-to-noise ratio in decibels'

M.downsampled:
  description: The same stationary process observed at a coarser sampling interval, generated at \(k\) times the length and decimated with an anti-aliasing filter. White-noise bases are excluded, since decimating them leaves only the filter's band-limited noise.
  equations:
    - 'x_t = (h * y)_{k t}, \qquad k \in \{2, \dots, 5\}'
  references:
    - Oppenheim & Schafer (2010). Discrete-Time Signal Processing, 3rd ed. Pearson.
    - Constructed for this collection.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(y\): the underlying process generated at a finer sampling interval'
    - '\(h\): the anti-aliasing filter; \(*\): convolution; \(k\): the decimation factor'

# ---------------------------------------------------------------- N · NAT
N.predator-prey-ssa:
  description: >-
    Stochastic predator–prey dynamics simulated event by event. Demographic noise from finite
    populations sustains quasi-cycles that the deterministic model would damp out.
  equations:
    - 'H \xrightarrow{b} 2H, \quad H + P \xrightarrow{c} 2P, \quad P \xrightarrow{d} \varnothing \quad \text{(Lotka–Volterra)}'
  simulation: Gillespie SSA; Lotka–Volterra (instances 0–1) or Rosenzweig–MacArthur (2); population scale stratified so demographic noise is visible; prey sampled at fixed intervals.
  references:
    - Gillespie (1977). Exact stochastic simulation of coupled chemical reactions. J. Phys. Chem. 81, 2340–2361.
    - McKane & Newman (2005). Predator–prey cycles from resonant amplification of demographic stochasticity. Phys. Rev. Lett. 94, 218102.
  where:
    - '\(H, P\): the numbers of prey and predators'
    - '\(b\): the prey birth rate; \(c\): the predation rate; \(d\): the predator death rate'
    - 'Each reaction fires at random times (Gillespie''s algorithm); \(\varnothing\): removal'

N.blowflies-ricker:
  fixed:
    - 'Ricker: carrying capacity \(K = 1\)'
    - 'Nicholson: 2% multiplicative observation noise'
  description: Nicholson's blowflies, a delayed-feedback population model whose maturation delay drives large, sharp-peaked population cycles (single- and double-peaked here), and the Ricker map with environmental noise.
  equations:
    - '\dot N = P\, N_\tau\, e^{-N_\tau/N_0} - \delta N, \qquad N_\tau = N(t - \tau)'
    - '\text{Ricker: } N_{t+1} = N_t\, e^{r(1 - N_t/K) + \sigma \varepsilon_t}'
  simulation: Blowflies with Gurney–Blythe–Nisbet parameters (\(\delta = 0.175\), \(\tau = 15\), \(P\) stratified over [6, 12]; instance 0) and a longer delay (\(\delta = 0.25\), \(\tau = 20\), \(P\) on [25, 35]; instance 1), both stable limit cycles, with 2% observation noise; Ricker map with \(r\) stratified over [1.8, 3.2] and environmental noise \(\sigma\) on [0.05, 0.3] (2–3).
  references:
    - Gurney, Blythe & Nisbet (1980). Nicholson's blowflies revisited. Nature 287, 17–21.
    - Ricker (1954). Stock and recruitment. J. Fish. Res. Board Can. 11, 559–623.
  where:
    - '\(N\): the population; \(N_\tau = N(t - \tau)\): its value one maturation delay \(\tau\) ago'
    - '\(P\): the maximum per-capita fecundity; \(N_0\): the population scale of density dependence; \(\delta\): the adult death rate'
    - 'Ricker: \(r\) growth rate, \(K\) carrying capacity, \(\sigma\) environmental noise, \(\varepsilon_t\) Gaussian noise'

N.sir-seir:
  fixed:
    - 'Recovery \(\gamma = 1/13\) day\(^{-1}\); latent rate 1/8 day\(^{-1}\) (SEIR); births and deaths \(1/(50 \times 365)\) day\(^{-1}\); immigration 2 per year'
    - 'Annual seasonal forcing; case counts per 14 days; the first five years discarded'
  description: >-
    Seasonally forced stochastic epidemics with births, deaths and immigration, as in measles:
    multi-annual outbreaks, fade-outs and reintroduction. Observed as fortnightly case counts.
  equations:
    - 'S \xrightarrow{\beta(t) S I / N} I \xrightarrow{\gamma I} R, \qquad \beta(t) = \beta_0\left(1 + \beta_1 \cos 2\pi t\right)'
  simulation: Gillespie SIR (even instances) or SEIR (odd); \(R_0\) log-stratified over [1.5, 15], \(N\) of 50 000 to 1 000 000; five years discarded before the record starts.
  references:
    - Keeling & Rohani (2008). Modeling Infectious Diseases in Humans and Animals. Princeton University Press.
  where:
    - '\(S, I, R\): the numbers of susceptible, infected and recovered people; \(N\): the population size'
    - '\(\beta(t)\): the seasonal transmission rate, with mean \(\beta_0\) and relative amplitude \(\beta_1\); \(t\) in years'
    - '\(\gamma\): the recovery rate'

N.rainfall-pulse:
  description: >-
    The Bartlett–Lewis rectangular-pulse rainfall model: storms arrive as a Poisson process, each
    storm spawns rain cells, and each cell is a rectangular pulse. Totals are zero-inflated and heavily right-skewed.
  equations:
    - 'x_t = \sum_{\text{cells}} i_c\, \left|[t, t+\Delta) \cap [s_c, s_c + d_c)\right|'
  simulation: Aggregated to hourly (even instances) or daily (odd) totals; storm rate stratified from temperate to convective regimes.
  references:
    - Rodriguez-Iturbe, Cox & Isham (1987). Some models for rainfall based on stochastic point processes. Proc. R. Soc. A 410, 269–288.
  where:
    - '\(x_t\): the rainfall total in interval \([t, t + \Delta)\)'
    - '\(i_c, s_c, d_c\): the intensity, start time and duration of rain cell \(c\)'

N.stick-slip:
  fixed:
    - 'Failure threshold 1. Time-predictable: after each quake the stress resets to 0 and a new threshold is drawn with s.d. cv. Slip-predictable: fixed threshold 1, stress drop gamma-distributed with CV cv'
    - 'Loading noise 30% per sample; 1% measurement noise'
  description: >-
    Stress on a fault under steady tectonic loading: a noisy linear ramp that drops at each
    earthquake, giving an irregular sawtooth. The two variants are time-predictable and slip-predictable recurrence.
  equations:
    - '\sigma(t) = \sigma_{\text{base}} + \dot\sigma\, (t - t_k) + \eta_t, \qquad \text{slip when } \sigma \ge \sigma_{\text{thr}}'
  simulation: Time-predictable (random failure threshold, full drop to a base level; instance 0) or slip-predictable (fixed threshold, random drop; 1); loading rate stratified so about 15–50 cycles fall in the record.
  references:
    - Shimazaki & Nakata (1980). Time-predictable recurrence model for large earthquakes. Geophys. Res. Lett. 7, 279–282.
  where:
    - '\(\sigma(t)\): the stress on the fault; \(\dot\sigma\): the tectonic loading rate'
    - '\(\sigma_{\text{base}}, \sigma_{\text{thr}}\): the base and failure-threshold stresses; \(t_k\): the time of the last earthquake'
    - '\(\eta_t\): measurement noise'

N.etas:
  fixed:
    - 'Aftershock productivity \(\alpha = 1.5\); Omori offset \(c = 0.01\) days; minimum magnitude \(m_0 = 3\); Gutenberg–Richter \(b = 1\), magnitudes capped at 7'
    - '\(K\) is set from the branching ratio \(n\): \(K = n(\beta - \alpha)/\beta\) with \(\beta = b \ln 10\)'
  description: >-
    The epidemic-type aftershock sequence model: background earthquakes each trigger Omori-law
    aftershock cascades with Gutenberg–Richter magnitudes. It is the burstiest process in the corpus.
  equations:
    - '\lambda(t) = \mu + \sum_{t_k < t} K e^{\alpha(m_k - m_0)} (t - t_k + c)^{-p}'
  simulation: Branching ratio stratified over [0.5, 0.95], Omori \(p\) over [1.05, 1.4]; observed as inter-event times.
  references:
    - Ogata (1988). Statistical models for earthquake occurrences and residual analysis for point processes. J. Am. Stat. Assoc. 83, 9–27.
  where:
    - '\(\lambda(t)\): the earthquake rate; \(\mu\): the background rate'
    - '\(t_k, m_k\): past earthquake times and magnitudes; \(m_0\): the minimum magnitude'
    - '\(K, \alpha\): the aftershock productivity; \(c, p\): the Omori–Utsu decay parameters'

N.barnes-sunspot:
  description: The Barnes model of the sunspot number, an ARMA(2,2) with an 11-year pseudo-period passed through a static nonlinearity that produces the asymmetric cycles.
  equations:
    - 'z_t = \mathrm{ARMA}(2,2), \qquad y_t = z_t^2 + 0.03\, z_t^3'
  simulation: Semi-annual sampling, so the 11-year pseudo-period is 22 samples (about 45 cycles per record).
  references:
    - Barnes, Sargent & Tryon (1980). Sunspot cycle simulation using random noise. In The Ancient Sun, Pergamon, 159–163.
  where:
    - '\(z_t\): an ARMA(2,2) process with an 11-year pseudo-period'
    - '\(y_t\): the observed sunspot-like series'

N.climate-model:
  fixed:
    - 'Hasselmann: a unit-variance OU process plus an annual cycle of amplitude 0.7 (period 12 samples: monthly data)'
    - 'ENSO: integrated with \(dt = 0.01\) and subsampled to 1000 points; 2% measurement noise'
    - 'Stommel: \(\eta_1 = 3\), \(\eta_3 = 0.3\); noise s.d. 0.25 on salinity'
    - 'Daisyworld: albedos 0.75 (white), 0.25 (black), 0.5 (bare ground); daisy death rate 0.3; luminosity noise 0.05, relaxing over 50 time units'
  description: >-
    Conceptual stochastic climate models: Hasselmann's red-noise ocean with an annual cycle, the ENSO
    delayed oscillator driven by weather noise, Stommel's bistable thermohaline circulation, and Daisyworld with noisy luminosity.
  equations:
    - '\text{Hasselmann: } dT = -T/\tau\, dt + \sigma\, dW \;(+\,\text{annual cycle})'
    - '\text{ENSO: } dT = \left(T - T^3 - \alpha\, T(t - \delta)\right) dt + \sigma\, dW'
  simulation: One model per instance. Hasselmann \(\tau\) log-uniform on [20, 200] months; ENSO \(\alpha\) stratified over [0.6, 0.95], \(\delta\) uniform on [1.5, 3]; Stommel \(\eta_2\) over [0.6, 1.3]; Daisyworld luminosity over [0.8, 1.2].
  references:
    - Hasselmann (1976). Stochastic climate models, Part I. Tellus 28, 473–485.
    - Suarez & Schopf (1988). A delayed action oscillator for ENSO. J. Atmos. Sci. 45, 3283–3287.
    - Stommel (1961). Thermohaline convection with two stable regimes of flow. Tellus 13, 224–230.
    - Watson & Lovelock (1983). Biological homeostasis of the global environment. Tellus B 35, 284–289.
  where:
    - '\(T\): the temperature anomaly; \(\tau\): the ocean''s damping time'
    - '\(\alpha\): the delayed-feedback strength; \(\delta\): the delay (ENSO)'
    - '\(\sigma\): the weather-noise strength'
    - '\(\xi(t)\), \(dW\): Gaussian white noise, the increment of a Wiener process'

N.turbulence:
  description: Turbulent velocities from the Sabra shell model at a mid-inertial shell (intermittent) and from the randomly forced viscous Burgers equation.
  equations:
    - '\text{Burgers: } u_t + u u_x = \nu u_{xx} + f(x, t)'
    - '\text{Sabra: } \dot u_n = i\left(a k_{n+1} u_{n+2} u^*_{n+1} + b k_n u_{n+1} u^*_{n-1} - c k_{n-1} u_{n-1} u_{n-2}\right) - \nu k_n^2 u_n + f_n'
  simulation: Burgers solved spectrally with 128 modes, observed at a point; Sabra integrated in scalar Python for cross-platform reproducibility.
  references:
    - L'vov, Podivilov, Pomyalov, Procaccia & Vandembroucq (1998). Improved shell model of turbulence. Phys. Rev. E 58, 1811.
  where:
    - 'Burgers: \(u(x, t)\) the velocity field, \(\nu\) the viscosity, \(f\) the random forcing; subscripts are partial derivatives'
    - 'Sabra: \(u_n\) the complex velocity of shell \(n\), \(k_n\) its wavenumber, \(a, b, c\) the interaction coefficients, \(f_n\) the forcing; \({}^*\): complex conjugate'

N.richardson-weather-stationary:
  description: The Richardson weather generator without its annual cycle, with wet and dry days from a Markov chain and gamma-distributed rainfall on wet days.
  equations:
    - 'P(\text{wet}_t \mid \text{wet}_{t-1}) = p_{11}, \qquad r_t \mid \text{wet} \sim \mathrm{Gamma}(k, \theta)'
  simulation: \(p_{11}\) stratified over [0.4, 0.8].
  references:
    - Richardson (1981). Stochastic simulation of daily precipitation, temperature, and solar radiation. Water Resour. Res. 17, 182–190.
  where:
    - '\(\text{wet}_t\): whether day \(t\) is wet; \(p_{11}\): the probability a wet day follows a wet day'
    - '\(r_t\): the rainfall amount on a wet day, gamma with shape \(k\) and scale \(\theta\)'

N.river-discharge-stationary:
  fixed:
    - 'Rainfall input: Markov wet/dry days with P(wet | wet) = 0.6 and P(wet | dry) = 0.25, amounts Gamma(0.8, 8)'
    - 'Baseflow: a slow AR(1) (coefficient 0.995) of 2% of the rain; 2% measurement noise'
  description: Daily river discharge from a Nash cascade of linear reservoirs driven by Markov-gamma rainfall, plus baseflow. Discharge rises sharply after rain and recedes slowly.
  equations:
    - 'Q(t) = \int_0^\infty h(s)\, R(t - s)\, ds + Q_b, \qquad h(s) = \frac{s^{n-1} e^{-s/k}}{k^n \Gamma(n)}'
  simulation: \(n\) stratified over [2, 5], \(k\) uniform on [1, 6] days; no seasonal input.
  references:
    - Nash (1957). The form of the instantaneous unit hydrograph. IASH Publ. 45, 114–121.
  where:
    - '\(Q(t)\): the discharge; \(Q_b\): the baseflow; \(R\): the rainfall input'
    - '\(h\): the Nash cascade''s response (unit hydrograph); \(n\): the number of reservoirs; \(k\): their time constant'
    - '\(\Gamma\): the gamma function'

N.onoff-traffic:
  fixed:
    - 'ON and OFF periods last \(2(1 + \mathrm{Pareto}(\alpha))\) samples; each source''s rate is U[0.5, 1.5]'
  description: >-
    Network traffic from many ON/OFF sources with heavy-tailed period lengths. Aggregating them gives
    self-similar packet counts with long-range dependence.
  equations:
    - 'x_t = \sum_{i=1}^{M} r_i\, \mathbb{1}[\text{source } i \text{ ON at } t], \qquad P(\text{ON} > \ell) \propto \ell^{-\alpha},\ \ H = (3 - \alpha)/2'
  simulation: Pareto ON and OFF periods with tail \(\alpha\) stratified over [1.5, 1.9] (\(H\) from 0.55 to 0.75); 150–400 sources, each with its own rate.
  references:
    - Willinger, Taqqu, Sherman & Wilson (1997). Self-similarity through high-variability. IEEE/ACM Trans. Netw. 5, 71–86.
  where:
    - '\(x_t\): the summed rate of the sources active in bin \(t\); \(M\): the number of sources'
    - '\(r_i\): source \(i\)''s rate; \(\ell\): an ON-period length; \(\alpha\): the Pareto tail index; \(H\): the resulting Hurst exponent'

N.speech:
  fixed:
    - 'Sampling rate 8 kHz; formant bandwidths 80, 100 and 150 Hz, drifting by up to 15%; glottal jitter 2% and shimmer 10%; voiced and unvoiced segments of 200–600 samples'
  description: >-
    Source–filter speech: a glottal pulse train (voiced) or noise (unvoiced) through a slowly varying
    all-pole vocal-tract filter, with voiced/unvoiced switching.
  equations:
    - 's_t = \sum_{k=1}^{p} a_k(t)\, s_{t-k} + g_t, \qquad g_t = \text{Rosenberg pulses (jitter, shimmer) or noise}'
  simulation: 8 kHz equivalent, about 125 ms of signal.
  references:
    - Rosenberg (1971). Effect of glottal pulse shape on the quality of natural vowels. J. Acoust. Soc. Am. 49, 583–590.
  where:
    - '\(s_t\): the speech signal; \(a_k(t)\): the vocal-tract filter coefficients (order \(p\)), varying slowly'
    - '\(g_t\): the source, a glottal pulse train or noise'

N.bearing-vibration:
  fixed:
    - 'Impulse sizes U[0.7, 1.3]; fault-period jitter 2%'
  description: Vibration of a rotating machine with a bearing fault. Each pass over the defect sends an impulse that rings a structural resonance.
  equations:
    - 'x_t = \sum_k h(t - t_k) + \eta_t, \qquad h(t) = e^{-\zeta\omega_0 t}\sin(\omega_d t),\ \ t_{k+1} - t_k \approx T_f'
  simulation: Fault period \(T_f\) stratified over [15, 60] samples (with jitter), resonance \(Q\) over [5, 30], plus broadband noise.
  references:
    - Randall & Antoni (2011). Rolling element bearing diagnostics—a tutorial. Mech. Syst. Signal Process. 25, 485–520.
  where:
    - '\(x_t\): the observed series, sample \(t = 1, \dots, 1000\)'
    - '\(t_k\): the fault impact times; \(T_f\): the fault period; \(h\): the resonance''s impulse response'
    - '\(\omega_0\): the resonance frequency; \(\zeta\): its damping ratio; \(\omega_d = \omega_0\sqrt{1 - \zeta^2}\)'
    - '\(\eta_t\): broadband noise'

N.collective:
  description: Collective order parameters near a phase transition, from the Kuramoto model of coupled oscillators and the 2-D Ising model just above its critical temperature.
  equations:
    - '\dot\theta_i = \omega_i + \frac{K}{N}\sum_j \sin(\theta_j - \theta_i), \qquad r e^{i\psi} = \frac{1}{N}\sum_j e^{i\theta_j}'
    - '\text{Ising: } m = \frac{1}{N}\sum_i s_i, \qquad P(\text{flip}) = \min(1, e^{-\Delta E/k_B T})'
  simulation: Kuramoto with \(N = 100\), standard-normal \(\omega_i\), weak phase noise and \(K\) stratified over [0.5, 3], across the synchronisation transition at \(K_c \approx 1.6\) (instances 0–1); Metropolis Ising on 32 × 32 at \(T/T_c\) over [1.03, 1.4], the disordered side, where correlations are finite (2).
  references:
    - Kuramoto (1984). Chemical Oscillations, Waves, and Turbulence. Springer.
  where:
    - 'Kuramoto: \(\theta_i\) the phase of oscillator \(i\), \(\omega_i\) its natural frequency, \(K\) the coupling, \(N\) the number of oscillators; \(r, \psi\) the order parameter''s magnitude (observed) and phase'
    - 'Ising: \(s_i = \pm 1\) the spins, \(m\) the magnetisation (observed), \(\Delta E\) the energy change of a flip, \(k_B T\) the temperature'

N.laser-feedback:
  fixed:
    - 'Dimensionless Lang–Kobayashi form: delay \(\tau = 1000\), carrier-to-photon lifetime ratio \(T = 1000\), pump \(P = 1\), linewidth factor \(\alpha = 4\)'
    - 'Spontaneous-emission noise of amplitude \(10^{-3}\); the intensity \(|E|^2\) is sampled every 20 time units'
  description: >-
    The Lang–Kobayashi model of a semiconductor laser with delayed optical feedback, in the
    low-frequency-fluctuation regime: the intensity shows sudden dropouts followed by gradual recovery.
  equations:
    - '\dot E = \tfrac{1}{2}(1 + i\alpha)\, N E + \kappa e^{-i\omega_0\tau} E(t - \tau)'
    - 'T\, \dot N = P - N - (1 + N)|E|^2'
  simulation: Dimensionless form with \(\alpha = 4\), \(\tau = 1000\), \(T = 1000\), \(P = 1\); feedback \(\kappa\) stratified over [0.08, 0.2]; weak spontaneous-emission noise; intensity \(|E|^2\) observed every 20 time units.
  references:
    - Lang & Kobayashi (1980). External optical feedback effects on semiconductor injection laser properties. IEEE J. Quantum Electron. 16, 347–355.
  where:
    - '\(E\): the complex electric field; \(|E|^2\): the intensity (observed); \(N\): the excess carrier density'
    - '\(\alpha\): the linewidth enhancement factor; \(\kappa\): the feedback strength; \(\tau\): the external-cavity delay; \(\omega_0\tau\): the feedback phase'
    - '\(T\): the carrier-to-photon lifetime ratio; \(P\): the pump current'

N.oregonator:
  description: The Oregonator model of the Belousov–Zhabotinsky reaction, a stiff relaxation oscillation whose spikes in HBrO\(_2\) span several orders of magnitude.
  equations:
    - '\epsilon \dot x = q y - x y + x(1 - x), \qquad \epsilon'' \dot y = -q y - x y + f z, \qquad \dot z = x - z'
  simulation: \(\epsilon = 0.04\), \(\epsilon' = 0.0004\), \(q = 0.0008\), \(f\) stratified over [0.6, 1.4], inside the oscillatory range (about 0.52 < \(f\) < 2.4); \(\log x\) (HBrO\(_2\)) observed.
  references:
    - Field & Noyes (1974). Oscillations in chemical systems. IV. J. Chem. Phys. 60, 1877–1884.
  where:
    - '\(x, y, z\): scaled concentrations of HBrO\(_2\), Br\(^-\) and the oxidised catalyst'
    - '\(\epsilon, \epsilon'', q\): the Tyson scaling constants; \(f\): the stoichiometric factor'

N.kirman:
  description: >-
    Kirman's ant (herding) model: agents switch between two options spontaneously or by recruitment.
    When recruitment dominates, the population fraction spends long spells near one extreme and switches in bursts.
  equations:
    - 'P(n \to n+1) = \frac{N - n}{N}\left(\varepsilon + k\frac{n}{N-1}\right), \qquad P(n \to n-1) = \frac{n}{N}\left(\varepsilon + k\frac{N-n}{N-1}\right)'
  simulation: \(N = 300\), \(k = 0.5\), \(\varepsilon\) log-uniform on [0.01, 0.05]; observed as \(n/N\) after 3 sweeps per sample.
  references:
    - Kirman (1993). Ants, rationality, and recruitment. Q. J. Econ. 108, 137–156.
  where:
    - '\(n\): the number of agents in state 1; \(N\): the number of agents'
    - '\(\varepsilon\): the rate of spontaneous conversion; \(k\): the recruitment rate'

N.rr-ipfm:
  description: >-
    Heartbeat intervals from an integral pulse frequency modulation model: the heart fires each time
    an integrated, modulated rate reaches threshold. The modulation carries respiratory (HF), Mayer-wave (LF) and 1/f variability.
  equations:
    - '\int_{t_k}^{t_{k+1}} \frac{1 + m(t)}{T_0}\, dt = 1, \qquad m = a_{\mathrm{LF}}\sin(2\pi\,0.1 t) + a_{\mathrm{HF}}\sin(2\pi\,0.25 t) + m_{1/f^\beta} + \text{noise}'
  simulation: \(\beta\) stratified over [0.8, 1.3], LF/HF power ratio log-uniform on [0.3, 4], mean interval \(T_0\) uniform on [0.7, 1.1] s; 1000 beats.
  references:
    - Bayly (1968). Spectral analysis of pulse frequency modulation in the nervous systems. IEEE Trans. Biomed. Eng. 15, 257–265.
  where:
    - '\(t_k\): the heartbeat times; the observed series is the intervals \(t_{k+1} - t_k\)'
    - '\(T_0\): the mean interval; \(m(t)\): the modulating signal'
    - '\(a_{\mathrm{LF}}, a_{\mathrm{HF}}\): the low- and high-frequency amplitudes; \(m_{1/f^\beta}\): a \(1/f^\beta\) component'

N.rr-ectopic:
  description: Heartbeat intervals with premature ectopic beats, each a short coupling interval followed by a compensatory pause.
  equations:
    - '(RR_k, RR_{k+1}) \mapsto (c\, RR_k,\ (2 - c)\, RR_k), \qquad c \sim \mathcal{U}[0.5, 0.7]'
  simulation: IPFM baseline rhythm; ectopy rate log-uniform on [1, 6]% of beats.
  references:
    - 'Task Force of the ESC and NASPE (1996). Heart rate variability: standards of measurement, physiological interpretation and clinical use. Circulation 93, 1043–1065.'
  where:
    - '\(RR_k\): the \(k\)-th heartbeat interval'
    - '\(c\): the coupling-interval fraction of a premature beat'

N.rr-af:
  fixed:
    - 'Concealed conduction: each blocked impulse lengthens the refractory period by 0.02 × prolongation; after each conducted beat it resets to \(\tau_r\) + prolongation × U[0, 1]'
  description: >-
    Heartbeat intervals in atrial fibrillation. Chaotic atrial impulses arrive at the AV node as a
    Poisson stream, and the node conducts only when it is not refractory, giving the irregularly irregular rhythm.
  equations:
    - 't^{\text{atrial}}_{j+1} - t^{\text{atrial}}_{j} \sim \mathrm{Exp}(\lambda), \qquad \text{conduct if } t - t_{\text{last}} \ge \tau_r'
  simulation: Atrial rate \(\lambda\) stratified over [4, 9] per second; refractory period 0.25–0.45 s, lengthened after each conducted beat and by blocked impulses (concealed conduction).
  references:
    - Cohen, Berger & Dushane (1983). A quantitative model for the ventricular response during atrial fibrillation. IEEE Trans. Biomed. Eng. 30, 769–781.
  where:
    - '\(t^{\text{atrial}}_j\): the atrial impulse times, a Poisson process with rate \(\lambda\)'
    - '\(t\): an impulse time; \(t_{\text{last}}\): the last conducted beat; \(\tau_r\): the AV node''s refractory period'

N.deboer:
  fixed:
    - 'Windkessel time constant \(R C\) with \(C = 1.5\); contractile term \(20\, I_{n-1}/0.9\) mmHg; respiratory amplitude \(A = 3\) mmHg'
    - 'Baroreflex \(f(S) = 18 \arctan((S - 120)/18)\), split 0.4 vagal (next beat) and 0.6 sympathetic (beats 2–5 back); noise s.d. 1 mmHg on pressure, 0.01 s on the interval'
  description: >-
    A beat-to-beat model of the baroreflex: systolic pressure, heart interval and peripheral resistance
    are coupled by a fast vagal and a slow sympathetic feedback, with Windkessel diastolic run-off and
    respiratory modulation of pressure.
  equations:
    - 'D_n = S_{n-1} e^{-I_{n-1}/(R_{n-1} C)}, \qquad S_n = D_n + \gamma I_{n-1} + A\sin(2\pi t_n/T_{\text{resp}}) + \varepsilon_n'
    - 'I_n = I_0 + G_v f(S_n) + G_s \textstyle\sum_{j=2}^{5} f(S_{n-j})/4, \qquad f(s) = 18 \arctan\!\left((s - 120)/18\right)'
  simulation: Reflex gain stratified over [6, 18]; respiration period uniform on [3, 5] s; RR observed (instances 0–1) or systolic pressure (2).
  references:
    - deBoer, Karemaker & Strackee (1987). Hemodynamic fluctuations and baroreflex sensitivity in humans. Am. J. Physiol. 253, H680–H689.
  where:
    - '\(S_n, D_n\): the systolic and diastolic pressure of beat \(n\); \(I_n\): the heartbeat interval; \(R_n\): the peripheral resistance'
    - '\(C\): the arterial compliance; \(\gamma\): the contractility factor; \(A, T_{\text{resp}}\): the respiratory amplitude and period'
    - '\(I_0\): the resting interval; \(G_v, G_s\): the vagal and sympathetic gains; \(f\): the baroreflex response; \(\varepsilon_n\): noise'

N.ecgsyn:
  fixed:
    - 'Wave angles \(\theta_i = (-\pi/3, -\pi/12, 0, \pi/12, \pi/2)\), amplitudes \(a_i = (1.2, -5, 30, -7.5, 0.75)\), widths \(b_i = (0.25, 0.1, 0.1, 0.1, 0.4)\) for P, Q, R, S, T'
    - 'RR modulation: Mayer waves (0.1 Hz) amplitude 0.04 and respiration (0.25 Hz) 0.03; R peak normalised to 1 mV; 0.05 mV baseline wander at 0.25 Hz and 0.03 mV noise'
  description: >-
    ECGSYN, a synthetic electrocardiogram: a trajectory around a limit cycle with the P, Q, R, S and
    T waves as Gaussian events, and realistic heart-rate variability.
  equations:
    - '\dot z = -\sum_{i \in \{P,Q,R,S,T\}} a_i\, \Delta\theta_i\, e^{-\Delta\theta_i^2/(2 b_i^2)} - (z - z_0)'
  simulation: 20–40 beats per record (log-stratified), RR from IPFM with 0.1 Hz and 0.25 Hz modulation; R peak normalised to 1 mV, plus 0.05 mV respiratory baseline wander and 0.03 mV noise.
  references:
    - McSharry, Clifford, Tarassenko & Smith (2003). A dynamical model for generating synthetic electrocardiogram signals. IEEE Trans. Biomed. Eng. 50, 289–294.
  where:
    - '\(z\): the ECG voltage (observed); \(z_0\): the baseline'
    - '\(\Delta\theta_i\): the angle from wave \(i\)''s position on the limit cycle'
    - '\(a_i, b_i\): the amplitude and width of wave \(i \in \{P, Q, R, S, T\}\)'

N.periodic-breathing:
  fixed:
    - 'Dimensionless: \(P = 1\), \(V_{\max} = 1.5\), \(\theta = 1\), \(n = 6\)'
    - 'Observed: a breathing waveform with period 8 samples and depth \(0.2 + V\); breath-to-breath jitter of 10% in rate and 8% in depth'
  description: >-
    The chemoreflex loop with a circulatory delay, a Mackey–Glass-type model of breathing control.
    Long delays destabilise it into Cheyne–Stokes periodic breathing.
  equations:
    - '\dot C = P - V(C(t - \tau))\, C, \qquad V(C) = V_{\max}\frac{C^n}{\theta^n + C^n}'
  simulation: The ventilation drive modulates the amplitude of a breathing waveform; delay \(\tau\) stratified from stable to periodic breathing.
  references:
    - Mackey & Glass (1977). Oscillation and chaos in physiological control systems. Science 197, 287–289.
  where:
    - '\(C\): the blood CO\(_2\) concentration; \(P\): its production rate'
    - '\(V\): the ventilation, responding to \(C\) a circulatory delay \(\tau\) earlier'
    - '\(V_{\max}, \theta, n\): the ventilatory response''s maximum, threshold and steepness'

N.neural-mass:
  fixed:
    - 'Jansen–Rit: \(A = 3.25\) mV, \(B = 22\) mV, \(a = 100\) s\(^{-1}\), \(b = 50\) s\(^{-1}\); sigmoid \(e_0 = 2.5\) s\(^{-1}\), \(r = 0.56\) mV\(^{-1}\), \(v_0 = 6\) mV; input noise s.d. 30 s\(^{-1}\)'
    - 'Wilson–Cowan: couplings \(w_{EE}, w_{EI}, w_{IE}, w_{II} = 16, 12, 15, 3\); thresholds 5 (E) and 12 (I); time constant 0.1; noise s.d. 0.15'
    - 'Epileptor: the constants of Jirsa et al. (2014); noise s.d. 0.025 on the fast subsystem and 0.25 on the second'
  description: >-
    Neural-mass models of EEG: Jansen–Rit cortical columns (alpha rhythm, spike-and-wave), noisy
    Wilson–Cowan populations, and the Epileptor, which cycles through seizure onset and offset, or, just
    below its seizure threshold, spikes interictally without seizing.
  equations:
    - '\text{Jansen–Rit: } \ddot y_i = A a\, S_i(\cdot) - 2a\dot y_i - a^2 y_i, \qquad S(v) = \frac{2e_0}{1 + e^{r(v_0 - v)}}'
    - '\text{Wilson–Cowan: } \tau_E \dot E = -E + S(w_{EE}E - w_{EI}I + P) + \sigma\xi'
  simulation: Jansen–Rit input \(p\) stratified across noise-driven alpha, 3 Hz spike-wave and high-input regimes; sampled at about 250 Hz equivalent.
  references:
    - Jansen & Rit (1995). Electroencephalogram and visual evoked potential generation in a mathematical model of coupled cortical columns. Biol. Cybern. 73, 357–366.
    - Wilson & Cowan (1972). Excitatory and inhibitory interactions in localized populations of model neurons. Biophys. J. 12, 1–24.
    - Jirsa et al. (2014). On the nature of seizure dynamics. Brain 137, 2210–2230.
  where:
    - 'Jansen–Rit: \(y_i\) the postsynaptic potentials, \(A\) the synaptic gain, \(a\) the inverse time constant, \(S\) the sigmoid with maximum \(2e_0\), slope \(r\) and threshold \(v_0\)'
    - 'Wilson–Cowan: \(E, I\) the excitatory and inhibitory activities, \(\tau_E\) the time constant, \(w\) the coupling weights, \(P\) the input, \(\sigma\xi\) noise'

N.neuron:
  description: >-
    Single-neuron models with noisy input current: Hodgkin–Huxley (tonic, and just below rheobase, where
    noise-induced spikes interrupt subthreshold oscillations), Izhikevich (regular spiking, chattering and a
    thalamo-cortical cell near threshold), Morris–Lecar and Hindmarsh–Rose bursting.
  equations:
    - '\text{Izhikevich: } \dot v = 0.04 v^2 + 5v + 140 - u + I, \quad \dot u = a(bv - u), \quad v \ge 30 \Rightarrow v \leftarrow c,\ u \leftarrow u + d'
    - '\text{Hodgkin–Huxley: } C\dot V = I - g_{\mathrm{Na}} m^3 h (V - E_{\mathrm{Na}}) - g_{\mathrm{K}} n^4 (V - E_{\mathrm{K}}) - g_L (V - E_L)'
  simulation: Membrane potential observed. Input currents above threshold for most instances; Hodgkin–Huxley near rheobase (\(I\) on [5.8, 6.2], weak noise) and the Izhikevich thalamo-cortical cell (\(I\) on [1.5, 2.5]) fire sparsely and irregularly.
  references:
    - Hodgkin & Huxley (1952). A quantitative description of membrane current and its application to conduction and excitation in nerve. J. Physiol. 117, 500–544.
    - Izhikevich (2003). Simple model of spiking neurons. IEEE Trans. Neural Netw. 14, 1569–1572.
  where:
    - 'Izhikevich: \(v\) the membrane potential (mV), \(u\) the recovery variable, \(I\) the input current, \(a, b, c, d\) the model parameters'
    - 'Hodgkin–Huxley: \(V\) the membrane potential, \(C\) the capacitance, \(m, h, n\) the gating variables, \(g\) the conductances, \(E\) the reversal potentials'

N.glucose-insulin:
  fixed:
    - '\(p_1 = 0.03\) min\(^{-1}\) (0.015 for the insulin-resistant series), \(p_2 = 0.02\) min\(^{-1}\); \(G_b = 90\) mg/dL, \(I_b = 10\) µU/mL'
    - 'Insulin clearance 0.14 min\(^{-1}\), secretion 0.005 per mg/dL of glucose above 80, acting after a 30-min delay; insulin noise s.d. 0.3'
    - 'Meals every 180–420 min (the first at 300–500 min), each a gamma-shaped appearance pulse peaking 30 min after the meal, of size U[2, 5] mg/dL/min'
    - 'Glucose sampled every 5 min; the first day is discarded'
  description: >-
    Blood glucose from the Bergman minimal model, driven by meals at irregular times and by an
    ultradian oscillation from delayed insulin action.
  equations:
    - '\dot G = -(p_1 + X) G + p_1 G_b + R_a(t), \qquad \dot X = -p_2 X + p_3 (I - I_b)'
  simulation: Meals every 3–7 h as gamma-shaped glucose appearance pulses (peak 2–5 mg/dL/min, so post-meal glucose peaks near 150–250 mg/dL); Sturis-type ultradian oscillation; one instance insulin-resistant (\(p_3 = 3 \times 10^{-6}\), \(p_1 = 0.015\)), with larger, slower excursions; sampled every 5 min over about 3.5 days.
  references:
    - Bergman, Ider, Bowden & Cobelli (1979). Quantitative estimation of insulin sensitivity. Am. J. Physiol. 236, E667–E677.
    - Sturis, Polonsky, Mosekilde & Van Cauter (1991). Computer model for mechanisms underlying ultradian oscillations of insulin and glucose. Am. J. Physiol. 260, E801–E809.
  where:
    - '\(G\): plasma glucose; \(G_b\): its basal level; \(R_a(t)\): the glucose appearance from meals'
    - '\(X\): insulin action; \(I, I_b\): plasma insulin and its basal level'
    - '\(p_1\): glucose effectiveness; \(p_2, p_3\): the insulin-action rate constants'

N.circadian-hormone:
  fixed:
    - 'Kronauer: light drive 0.3 L for 16 h a day (lights on at 07:00, jittered by up to ±4 h for the melatonin series); daily light intensity \(L \sim\) U[0.25, 1]; oscillator noise 0.01'
    - 'Hormone: Weibull(2.5) pulse intervals, Gamma(2, 1) pulse masses; 5% measurement noise'
  description: >-
    Circadian and pulsatile physiology: the Kronauer circadian pacemaker, a higher-order van der
    Pol-type limit-cycle oscillator entrained by a light–dark cycle, and pulsatile hormone secretion with exponential clearance.
  equations:
    - '\dot x = \tfrac{\pi}{12}\left[x_c + \mu\left(\tfrac{x}{3} + \tfrac{4}{3}x^3 - \tfrac{256}{105}x^7\right) + B\right], \qquad \dot x_c = \tfrac{\pi}{12}\left[q B x_c - x\left(\left(\tfrac{24}{0.99669\,\tau_x}\right)^2 + k B\right)\right]'
    - '\text{hormone: } c(t) = \sum_k M_k\, e^{-(t - t_k)/\tau_c}, \qquad t_k \text{ renewal pulses}'
  simulation: Circadian model sampled hourly with \(\tau_x\) stratified over [23.5, 25] h and day-to-day variation in light intensity (instance 0); the same pacemaker under an irregular light schedule, read out as a melatonin-like nocturnal pulse (1); pulsatile secretion with gamma pulse masses sampled every 10 min (2–3).
  references:
    - Jewett, Forger & Kronauer (1999). Revised limit cycle oscillator model of human circadian pacemaker. J. Biol. Rhythms 14, 493–499.
    - Keenan & Veldhuis (1998). A biomathematical model of time-delayed feedback in the human male hypothalamic–pituitary–Leydig cell axis. Am. J. Physiol. 275, E157–E176.
  where:
    - '\(x, x_c\): the circadian pacemaker''s state (\(x\) observed); \(\mu = 0.13\): its stiffness; \(\tau_x\): its intrinsic period in hours; \(B\): the light drive; \(q = 1/3\), \(k = 0.55\): the light-coupling constants'
    - '\(c(t)\): the hormone concentration; \(t_k, M_k\): the secretion pulse times and masses; \(\tau_c\): the clearance time'

N.gene-cell:
  fixed:
    - 'Telegraph model: mRNA degradation \(\gamma = 0.1\); protein translation \(k_p = 2\), dilution \(\gamma_p = 0.2\); sampled every unit of time'
    - 'Goldbeter: channel noise \(0.3\sqrt{|u|}\); 2% measurement noise'
  description: >-
    Noise and oscillations inside cells: bursty telegraph-model transcription simulated molecule by
    molecule and read out as protein, and noisy calcium-induced calcium release oscillations.
  equations:
    - '\text{telegraph: } G_{\text{off}} \underset{k_{\text{off}}}{\overset{k_{\text{on}}}{\rightleftharpoons}} G_{\text{on}} \xrightarrow{k} G_{\text{on}} + M, \quad M \xrightarrow{\gamma} \varnothing, \qquad p_{t+1} = p_t + k_p M_t - \gamma_p p_t'
    - '\text{Goldbeter: } \dot Z = v_0 + v_1\beta - v_2(Z) + v_3(Z, Y) + k_f Y - k Z, \quad \dot Y = v_2(Z) - v_3(Z, Y) - k_f Y'
  simulation: Telegraph transcription by Gillespie SSA (\(k_{\text{on}}\) log-stratified over [0.05, 0.3]), with protein translated from the mRNA count and diluted (lifetime about 5 samples; four instances); the Goldbeter model with stimulation \(\beta\) stratified over [0.3, 0.9] and intrinsic channel noise (two instances).
  references:
    - Peccoud & Ycart (1995). Markovian modeling of gene-product synthesis. Theor. Popul. Biol. 48, 222–234.
    - Goldbeter, Dupont & Berridge (1990). Minimal model for signal-induced Ca²⁺ oscillations. PNAS 87, 1461–1465.
  where:
    - 'Telegraph: \(G_{\text{on}}, G_{\text{off}}\) the gene''s states, switching at rates \(k_{\text{on}}, k_{\text{off}}\); \(M\) the mRNA molecules, \(k\) the transcription rate, \(\gamma\) the degradation rate; \(p\) the protein level (observed), \(k_p\) its translation rate, \(\gamma_p\) its dilution rate'
    - 'Goldbeter: \(Z\) cytosolic Ca²⁺ (observed), \(Y\) Ca²⁺ in the internal store, \(\beta\) the stimulation; \(v_2, v_3\) the pumping and release fluxes'

N.gait-emg-tremor:
  fixed:
    - 'Gait: 1.1 s + 0.03 × fGn'
    - 'EMG: envelope \(0.1 + \max(0, \sin 2\pi t/P)^2\) times Gaussian noise'
    - 'Tremor: an AR(2) resonance with pole radius 0.97, plus white noise of s.d. 0.5'
  description: Movement physiology, including stride intervals with fractal fluctuations, surface EMG gated by the gait cycle, and physiological tremor.
  equations:
    - '\text{stride: } I_n = 1.1\,\mathrm{s} + 0.03\, \epsilon^{(H)}_n, \qquad \text{EMG: } x_t = a(t)\, \varepsilon_t,\ a(t) \text{ a bursting envelope}'
  simulation: Stride-interval \(H\) stratified over [0.6, 0.9] (two instances); tremor as 8–12 Hz narrowband noise at 100 Hz sampling.
  references:
    - Hausdorff et al. (1995). Is walking a random walk? Evidence for long-range correlations in stride interval of human gait. J. Appl. Physiol. 78, 349–358.
  where:
    - '\(I_n\): the \(n\)-th stride interval; \(\epsilon^{(H)}_n\): fractional Gaussian noise with Hurst exponent \(H\)'
    - 'EMG: \(\varepsilon_t\) a Gaussian carrier, \(a(t)\) the muscle-activation envelope'

