# What each named system is, for families that collect many different systems under one card
# (dysts flows and maps, canonical flow regimes, 2-D map regimes, classic 1-D maps). Shown on the quiz card,
# in Full details and in the series pop-up, ahead of the family card.
# Keys are series names (names.series_name); a "family/name" key takes precedence where two families
# use the same name for different systems. One or two sentences, ending with the original source.

# ---------- 1-D maps ----------
Tent map: "A piecewise-linear map that stretches the unit interval and folds it at its midpoint, chaotic for slopes above one."
Sine map: "The map x → a sin(πx), a smooth one-hump map that follows the same period-doubling route to chaos as the logistic map."
Cubic map: "The map x → a x(1 − x²), a symmetric map with two humps, so orbits can wander between positive and negative values."
Chebyshev map: "Iteration of a Chebyshev polynomial, x → cos(k arccos x), fully chaotic on [−1, 1] with an exactly known invariant density."
dysts-map/Gauss map: "The Gaussian (or 'mouse') map, x → e^{−a x²} + b: a bell-shaped one-hump map with period doubling, chaos and bistability."
Logistic map: "May's discrete-time population model x → r x(1 − x), the textbook route to chaos through period doubling (May 1976)."
Ricker map: "Ricker's stock–recruitment model for fish, x → x e^{r(1 − x)}, in which overcompensating density dependence makes populations chaotic (Ricker 1954)."

# ---------- 2-D maps ----------
Baker's map: "A piecewise-linear map of the unit square that stretches it, cuts it in two and stacks the halves, like kneading dough: the textbook example of mixing."
Bedhead map: "A two-dimensional trigonometric map from Ivan Emrich's collection of fractal-art attractors."
Blinking vortex map: "Aref's blinking vortex sampled once per period: a fluid particle stirred by two point vortices that switch on and off in turn, the original model of chaotic advection (Aref 1984)."
Bogdanov map: "A planar map obtained by discretizing the Bogdanov–Takens normal form, with a Hopf bifurcation, mode locking and chaos (Bogdanov 1981; Arrowsmith et al. 1993)."
Chirikov standard map: "The kicked rotor, a pendulum kicked periodically: its phase space mixes regular islands (KAM tori) with chaos, a basic model of Hamiltonian chaos (Chirikov 1979)."
De Jong map: "A two-dimensional map built from sines and cosines, popularized by Peter de Jong as a source of fractal-art attractors."
Hénon map: "Hénon's two-dimensional quadratic map, a simplified model of a Poincaré section of the Lorenz flow and the classic strange attractor of a map (Hénon 1976)."
Hopalong map: "Barry Martin's 'hopalong' map, built from a square root and an absolute value, popularized as a source of fractal art (Dewdney 1986)."
Ikeda map: "Light circulating in an optical ring cavity that contains a nonlinear medium, sampled once per round trip (Ikeda 1979)."
Kaplan–Yorke map: "A fully chaotic doubling map driving a contracting second variable, built to test the Kaplan–Yorke relation between Lyapunov exponents and fractal dimension (Kaplan & Yorke 1979)."
Maynard Smith map: "A second-order population model with delayed density dependence, x_{n+1} = y_n, y_{n+1} = a y_n + b − x_n² (Maynard Smith 1968)."
Pickover map: "A two-dimensional trigonometric map from Clifford Pickover's collection of fractal-art attractors."
Svensson map: "A two-dimensional trigonometric map from the collection of fractal-art attractors."
Lozi map: "A piecewise-linear version of the Hénon map, with |x| in place of x², whose strange attractor can be analyzed exactly (Lozi 1978)."
Arnold's cat map: "A linear map of the torus that stretches and folds any picture (famously, a cat) into apparent noise: uniformly hyperbolic, fully chaotic and mixing (Arnold & Avez 1968)."
Burgers map: "A two-dimensional quadratic map, the discretized form of a pair of equations Burgers used as a toy model of turbulence (Whitehead & MacDonald 1984)."
Coupled logistic maps: "Two chaotic logistic maps, each nudged toward the other's state, so the pair moves between independent chaos and synchronization."

# ---------- flows ----------
Aizawa system: "A three-dimensional flow whose attractor winds around a sphere-like surface with a tube along its axis (Aizawa & Uezu 1982)."
Anishchenko–Astakhov oscillator: "An electronic generator with inertial nonlinearity: amplification depends on a slowly heating element, which turns self-oscillation into chaos (Anishchenko & Astakhov)."
Arneodo system: "A jerk-type flow from Arneodo, Coullet and Tresser's study of strange attractors in Volterra-type equations, a classic example of Shilnikov chaos (Arneodo, Coullet & Tresser 1981)."
Arnold–Beltrami–Childress flow: "A steady, exact solution of Euler's equations for an inviscid 3-D fluid whose streamlines are chaotic; the series follows one fluid particle (Arnold 1965)."
Arnold web: "A nearly integrable Hamiltonian system, in which overlapping resonances form a web along which orbits drift slowly (Arnold diffusion) (Froeschlé, Guzzo & Lega 2000)."
Atmospheric regime model: "A low-order model of an atmospheric flow switching between regimes, built from coupled oscillators with widely separated frequencies (Tuwankotta 2006)."
Beer RNN: "A small continuous-time recurrent neural network, of the kind used as a minimal model nervous system for simulated agents (Beer 1995)."
Belousov–Zhabotinsky reaction: "A three-variable model of the Belousov–Zhabotinsky reaction, an oscillating chemical reaction, in a regime with period doubling and chaos (Györgyi & Field 1992)."
Bickley jet: "A tracer in a model of a meandering atmospheric zonal jet flanked by vortices: a steady flow plus a time-periodic perturbation (Rypina et al. 2007)."
Blasius system: "A food chain of vegetation, herbivores and predators whose population peaks vary chaotically while their timing stays regular, as in the Canadian lynx cycle (Blasius, Huppert & Stone 1999)."
Blinking rotlet: "Viscous (Stokes) flow in a disk stirred by a point rotor that switches between two positions, a model of chaotic mixing (Meleshko & Aref 1996)."
Blinking vortex: "A fluid particle stirred by two point vortices that switch on and off in turn, the original model of chaotic advection (Aref 1984)."
Bouali system: "A model of economic cycles: a van der Pol-type oscillator extended with a feedback loop that represents fluctuating demand (Bouali 1999)."
Bouali system 2: "A second variant of Bouali's economic-cycle model, an extended van der Pol-type oscillator with feedback (Bouali 1999)."
Burke–Shaw system: "A three-dimensional flow related to the Lorenz system, with a scroll attractor symmetric about the z axis (Shaw 1981)."
Calcium oscillator: "Intracellular calcium oscillations driven by calcium-induced calcium release and IP₃ metabolism, here in a chaotic regime (Houart, Dupont & Goldbeter 1999)."
Quasi-periodic calcium oscillator: "The same intracellular calcium model at parameters that give quasi-periodic (torus) oscillations rather than chaos (Houart, Dupont & Goldbeter 1999)."
Cellular neural network: "A small cellular neural network: a few locally coupled analog neurons with piecewise-linear outputs, as built in hardware (Arena et al. 1998)."
Chen system: "A Lorenz-like system found by chaos anti-control (feedback designed to make a system chaotic), whose double-scroll attractor is not equivalent to Lorenz's (Chen & Ueta 1999)."
Chen–Lee system: "A rigid body (a gyro) rotating under feedback control chosen to make its motion chaotic (Chen & Lee 2004)."
Chua circuit: "An electronic circuit of two capacitors, an inductor and a nonlinear negative resistor (Chua's diode), with the famous double-scroll attractor (Matsumoto 1984)."
Circadian rhythm: "A model of the Drosophila circadian clock (the PER and TIM proteins) driven by a light–dark cycle, which can respond chaotically (Leloup, Gonze & Goldbeter 1999)."
Coevolving predator–prey: "Predator–prey dynamics in which the prey's defensive trait evolves in response to the predator, which makes the populations fluctuate chaotically (Gilpin & Feldman 2017)."
Colpitts system: "The Colpitts oscillator, a single-transistor circuit used as a signal generator, which becomes chaotic for suitable component values (Kennedy 1994)."
Coullet system: "A jerk-type variant of the Arneodo system with a cubic nonlinearity (Arneodo, Coullet & Tresser 1981)."
Dadras system: "A three-dimensional quadratic flow that can generate two-, three- and four-scroll attractors depending on its parameters (Dadras & Momeni 2009)."
Dequan Li system: "A three-scroll chaotic attractor, one of the three-scroll unified chaotic systems (TSUCS) (Li 2008)."
Double gyre: "A fluid particle in two counter-rotating gyres whose dividing line oscillates, a standard model for Lagrangian coherent structures in ocean flows (Shadden, Lekien & Marsden 2005)."
Double pendulum: "Two pendulums hung end to end, without friction: a conservative Hamiltonian system that is chaotic at high enough energy."
Excitable cell: "A three-variable Hodgkin–Huxley-type model of an excitable cell membrane, whose bursts of spikes become chaotic (Chay 1985)."
Finance model: "A model of a financial system in which the interest rate, investment demand and price index interact nonlinearly (Cai & Huang 2007)."
Fluid trampoline: "A droplet bouncing on a vibrating soap film, which acts as a trampoline; at strong forcing the bounces become chaotic (Gilet & Bush 2009)."
Forced Brusselator: "Prigogine's Brusselator, a model autocatalytic chemical oscillator, driven periodically so that it can respond chaotically (Prigogine & Lefever 1968)."
Forced FitzHugh–Nagumo: "The FitzHugh–Nagumo neuron model driven by a periodic current, which gives irregular spiking (FitzHugh 1961)."
Forced van der Pol: "Van der Pol's triode oscillator with sinusoidal forcing, which can lock to the drive or respond chaotically (van der Pol 1920)."
Genesio–Tesi system: "A jerk-type flow (a third-order equation) with a single quadratic nonlinearity, from studies of chaos in feedback control systems (Genesio & Tesi 1992)."
Glycolytic oscillation: "A model of glycolysis in which allosteric feedback on the enzymes (Monod–Wyman–Changeux kinetics) produces oscillations, including chaotic ones (Decroly & Goldbeter 1982)."
Guckenheimer–Holmes system: "A three-dimensional nonlinear oscillator, a rotating oscillation coupled to a third variable, from Guckenheimer and Holmes' study of nonlinear oscillations and bifurcations (Guckenheimer & Holmes 1983)."
Hadley circulation: "Lorenz's low-order model of the overturning Hadley cell of the atmosphere: a westerly jet exchanging energy with traveling eddies (the Lorenz-84 equations at different parameters) (Lorenz 1984)."
Halvorsen system: "A cyclically symmetric quadratic flow (x, y and z play identical roles in turn), one of Sprott's algebraically simple chaotic flows (Sprott 2010)."
Hastings–Powell food chain: "A three-species food chain (resource, consumer, predator) with saturating feeding, which produces the 'teacup' chaotic attractor (Hastings & Powell 1991)."
Hénon–Heiles system: "A star's motion in the mean gravitational potential of a galaxy, reduced to two degrees of freedom: a conservative system with both regular and chaotic orbits (Hénon & Heiles 1964)."
Hindmarsh–Rose neuron: "A three-variable neuron model with fast spiking and a slow adaptation current, which gives bursts of spikes that can be chaotic (Hindmarsh & Rose 1984)."
Hopfield network: "A small continuous-time neural network with frustrated (mutually inconsistent) connections, which keep it from settling and make it chaotic (Lewis & Glass 1992)."
Hyperchaotic Bao system: "A four-dimensional hyperchaotic system (two positive Lyapunov exponents), obtained by adding a feedback variable to the Lü system (Bao & Liu 2008)."
Hyperchaotic Cai system: "A four-dimensional hyperchaotic extension of the Cai–Huang finance model (Cai & Huang 2007)."
Hyperchaotic Jha system: "A four-dimensional hyperchaotic system, with two positive Lyapunov exponents."
Hyperchaotic Lorenz system: "A four-dimensional extension of the Lorenz system with an extra feedback variable, which makes it hyperchaotic (two positive Lyapunov exponents)."
Hyperchaotic Lü system: "A four-dimensional hyperchaotic system obtained from the Lü system by state-feedback control (Chen, Lu, Lü & Yu 2006)."
Hyperchaotic Pang system: "A four-dimensional hyperchaotic system derived from the Lü system (Pang & Liu 2011)."
Hyperchaotic Qi system: "A four-dimensional hyperchaotic variant of the Qi system (Qi, van Wyk, van Wyk & Chen 2008)."
Hyperchaotic Wang system: "A four-dimensional hyperchaotic extension of the Wang four-wing system (Wang et al. 2009)."
Hyperchaotic Xu system: "A four-dimensional hyperchaotic system, with two positive Lyapunov exponents."
Hyperchaotic Yan system: "A four-dimensional hyperchaotic system, with two positive Lyapunov exponents."
Hyperchaotic Yang–Chen system: "A four-dimensional hyperchaotic system, with two positive Lyapunov exponents."
Interior squirmer: "Slow viscous flow inside a cylinder driven by a time-periodic slip velocity at its wall, like the flow inside a swimming microorganism; a tracer in it moves chaotically (Blake 1971)."
Isothermal chemical reaction: "A model of an isothermal autocatalytic reaction with mixed-mode oscillations, in which large and small peaks alternate (Petrov, Scott & Showalter 1992)."
Itik–Banks tumor model: "Competing populations of tumor cells, healthy host cells and immune effector cells, whose interactions can be chaotic (Itik & Banks 2010)."
Jerk circuit: "An electronic circuit that implements a jerk equation (third-order), with a diode as its only nonlinearity (Sprott 2011)."
Kawczynski–Strizhak reaction: "A three-variable model of the Belousov–Zhabotinsky reaction that shows mixed-mode and chaotic oscillations (Strizhak & Kawczynski 1995)."
Laser model: "A three-dimensional model of a semiconductor laser, also realized as an electronic circuit (Abooee, Yaghini-Bonabi & Jahed-Motlagh 2013)."
Lid-driven cavity flow: "A fluid particle in a cavity whose two walls slide alternately, a model of chaotic mixing in a viscous flow (Grover et al. 2012)."
Liu–Chen system: "A three-dimensional chaotic flow with quadratic nonlinearities, proposed as a new member of the Lorenz–Chen family of attractors (Liu & Chen 2004)."
Lorenz system: "Lorenz's three-mode model of convection in a fluid layer heated from below, the original strange attractor, with its butterfly-shaped double lobe (Lorenz 1963)."
Lorenz-84 system: "Lorenz's low-order model of the general circulation of the atmosphere: a westerly jet exchanging energy with traveling eddies (Lorenz 1984)."
Lorenz-96 system: "Lorenz's model of an atmospheric quantity at equally spaced sites around a latitude circle, with advection, damping and constant forcing; the series is one site (Lorenz 1996)."
Bounded Lorenz system: "The Lorenz system modified by a confining term that keeps its orbits within a sphere (Sprott & Xiong 2015)."
Coupled Lorenz system: "Two Lorenz systems with different parameters, the second driven by the first through a coupling term, so their chaotic motions interact."
Lorenz–Stenflo system: "A four-variable extension of the Lorenz system for acoustic-gravity waves in a rotating atmosphere, which can be hyperchaotic (Stenflo 1996)."
Lü–Chen system: "A unified system that bridges the Lorenz and Chen attractors as one parameter varies (Lü & Chen 2002)."
Lü–Chen–Cheng system: "A Lorenz-like system that generates a four-scroll attractor (Lü, Chen & Cheng 2004)."
MacArthur consumer–resource model: "Several plankton species competing for a few nutrients (MacArthur's consumer–resource model), whose abundances fluctuate chaotically (Huisman & Weissing 1999)."
Moore–Spiegel oscillator: "A fluid element oscillating in a temperature-stratified layer, a model from stellar convection (Moore & Spiegel 1966)."
Multi-scroll Chua circuit: "A Chua-type circuit whose nonlinearity has several segments, so its attractor has several scrolls rather than two (Yalçın, Suykens & Vandewalle)."
Newton–Leipnik system: "Euler's equations for a rotating rigid body with linear feedback, which has two coexisting strange attractors (Leipnik & Newton 1981)."
Nosé–Hoover oscillator: "A particle in a harmonic potential coupled to a thermostat variable that holds its temperature fixed, a conservative system from molecular dynamics (Nosé 1984; Hoover 1985)."
Nuclear quadrupole: "A Hamiltonian model of collective quadrupole vibrations of an atomic nucleus, chaotic through overlapping resonances (Baran & Raduta 1998)."
Oscillating flow: "A fluid particle in a chain of convection rolls whose boundaries oscillate, a model of transport between rolls (Solomon & Gollub 1988)."
Pan–Xu–Zhou system: "A three-dimensional quadratic flow related to the Dequan Li attractor (Zhou et al. 2008)."
Pehlivan–Wei system: "A three-dimensional quadratic flow with Hopf bifurcations of codimension one and two, also realized as an electronic circuit (Pehlivan & Wei 2012)."
Qi system: "A four-dimensional quadratic flow that is hyperchaotic (two positive Lyapunov exponents), with an unusually broad power spectrum (Qi, van Wyk, van Wyk & Chen 2008)."
Qi–Chen system: "A three-dimensional quadratic flow with a double-wing attractor, formed from two bistable attractors (Qi et al. 2008)."
Rabinovich–Fabrikant system: "A model of the self-modulation of waves in a nonequilibrium medium such as a plasma, known for its unusually shaped attractors (Rabinovich & Fabrikant 1979)."
Rayleigh–Bénard convection: "A low-order model of Rayleigh–Bénard convection, a fluid layer heated from below (Yanagita & Kaneko 1995)."
Rikitake dynamo: "Two coupled disk dynamos, a model of the irregular reversals of Earth's magnetic field (Rikitake 1958)."
Rössler system: "Rössler's minimal chaotic flow, with a single quadratic term: orbits spiral outward in a plane and are folded back in (Rössler 1976)."
Rössler funnel: "The Rössler system in its funnel regime (a = 0.3, c = 14), where orbits make several small turns between large excursions (Rössler 1976)."
Rucklidge system: "A model of double convection, in which temperature and a second quantity (such as salinity or a magnetic field) both drive the flow (Rucklidge 1992)."
Sakarya system: "A three-dimensional flow whose four-wing attractor forms when two coexisting attractors merge (Li et al. 2015)."
Salton Sea ecosystem: "An eco-epidemiological model of the Salton Sea, California: healthy fish, infected fish and the fish-eating birds that prey on them (Upadhyay et al. 2007)."
San-Um–Srisuchinwong system: "A flow with an absolute-value (piecewise) nonlinearity and a two-scroll attractor (San-Um & Srisuchinwong 2012)."
Shimizu–Morioka system: "A Lorenz-like model in which a symmetric limit cycle splits into asymmetric ones on the way to chaos (Shimizu & Morioka 1980)."
Sprott A: "Sprott's case A, the first of 19 algebraically simple chaotic flows (A–S) found by computer search. It has five terms and two quadratic nonlinearities and is conservative: a special case of the Nosé–Hoover oscillator (Sprott 1994)."
Sprott B: "Sprott's case B, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with five terms and two quadratic nonlinearities (Sprott 1994)."
Sprott C: "Sprott's case C, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with five terms and two quadratic nonlinearities (Sprott 1994)."
Sprott D: "Sprott's case D, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with five terms and two quadratic nonlinearities (Sprott 1994)."
Sprott E: "Sprott's case E, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with five terms and two quadratic nonlinearities (Sprott 1994)."
Sprott F: "Sprott's case F, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott G: "Sprott's case G, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott H: "Sprott's case H, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott I: "Sprott's case I, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott J: "Sprott's case J, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott K: "Sprott's case K, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott L: "Sprott's case L, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott M: "Sprott's case M, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott N: "Sprott's case N, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott O: "Sprott's case O, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott P: "Sprott's case P, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott Q: "Sprott's case Q, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott R: "Sprott's case R, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott S: "Sprott's case S, one of 19 algebraically simple chaotic flows (A–S) found by computer search, with six terms and a single quadratic nonlinearity (Sprott 1994)."
Sprott jerk system: "The simplest known dissipative chaotic flow, a single jerk equation x‴ = −A x″ + (x′)² − x (Sprott 1997)."
Sprott–More system: "A flow from Sprott's 'Do we need more chaos examples?', whose multifractal attractor nearly fills three dimensions (Sprott 2020)."
Sprott torus: "A flow with coexisting attractors: depending on where it starts, an orbit settles onto a torus or onto a chaotic attractor (Sprott 2014)."
Stick-slip oscillator: "A weakly forced oscillator with dry friction, whose motion alternates between sticking and slipping (Awrejcewicz & Holicke 1999)."
Swinging Atwood machine: "Atwood's machine with one weight free to swing like a pendulum: a conservative system that is chaotic for some mass ratios (Tufillaro, Abbott & Griffiths 1984)."
Thomas system: "Thomas' cyclically symmetric attractor, ẋ = b sin y − a x and its cyclic permutations: a particle moving with friction through a 3-D lattice of forces (Thomas 1999)."
Thomas labyrinth: "Thomas' cyclically symmetric system at weak friction, whose orbits wander through a 3-D lattice of cells like a deterministic random walk (Thomas 1999)."
Torus flow: "A minimal quasi-periodic flow on a torus: two incommensurate rotations, so it never repeats, but it is not chaotic."
TSUCS2 system: "The second form of the three-scroll unified chaotic system (TSUCS), related to the Dequan Li attractor (Pan, Zhou & Li 2013)."
Turchin–Hanski vole model: "Vole populations in northern Fennoscandia under predation by specialist and generalist predators, with a seasonal cycle; their multi-year cycles are chaotic (Turchin & Hanski 1997)."
Vallis El Niño model: "Vallis' three-variable model of El Niño: an ocean current and the east–west temperature difference across the equatorial Pacific, with an annual cycle (Vallis 1988)."
Wang–Sun system: "A three-dimensional flow with a four-wing attractor (Wang, Sun, van Wyk, Qi & van Wyk 2009)."
WINDMI magnetosphere model: "A reduced model of energy flow from the solar wind into Earth's magnetosphere and ionosphere, driven by the solar-wind voltage (Smith, Thiffeault & Horton 2000)."
Yu–Wang system: "A chaotic flow with an exponential nonlinearity, realized as a temperature-compensation circuit with an operational amplifier (Yu & Wang 2012)."
Yu–Wang system 2: "A second variant of the Yu–Wang system, an alternative temperature-compensation circuit (Yu & Wang 2012)."
Zhou–Chen system: "A smooth three-dimensional flow whose attractor has three layers (Zhou & Chen 2004)."
Forced Duffing oscillator: "A damped particle in a double-well potential, shaken periodically so that it hops chaotically between the wells (Duffing 1918; Ueda 1979)."
Driven pendulum: "A damped pendulum driven by a periodic torque, which swings and tumbles over the top chaotically."
